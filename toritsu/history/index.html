/* 起動スプラッシュの制御：
   数秒表示 → フェードアウト。表示中にクリック／キー押下で即フェードアウト。 */
(function(){
  const splash = document.getElementById("splash");
  if(!splash) return;
  let dismissed = false;
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    splash.classList.add("out");
    // スプラッシュが消え始めるのに合わせて、トップ画面を順次フェードインさせる
    const home = document.getElementById("homeScreen");
    if(home){
      home.classList.add("intro");
      // 全フェーズ（最大 delay1.9s + duration0.9s ≒ 2.8s）終了後に intro を外す
      setTimeout(()=>{ home.classList.remove("intro"); }, 3200);
    }
    // 設定ボタンも、見出しが出そろうころに遅れてフェードイン
    const sbtn = document.getElementById("settingsBtn");
    if(sbtn){
      sbtn.classList.add("intro");
      setTimeout(()=>{ sbtn.classList.remove("intro"); }, 3600);
    }
    // 3つの見出しが出終わってから、桜の花びらを散らし始める
    setTimeout(()=>{ if(typeof startSakura==="function") startSakura(); }, 3200);
    // 桜と同時に、環境音をフェードイン（選ばれている種類で）
    setTimeout(()=>{
      if(window.ambientEnabled!==false && ambientAudio) ambientAudio.start(window.ambientType || "komorebi", 3);
    }, 3200);
    // フェードアウト（.6s）が終わったらDOMから消す
    setTimeout(()=>{ splash.remove(); }, 650);
    window.removeEventListener("click", dismiss);
    window.removeEventListener("keydown", dismiss);
    window.removeEventListener("touchstart", dismiss);
  }
  // 4秒後に自動フェードアウト
  const timer = setTimeout(dismiss, 4000);
  // 表示中の操作で即フェードアウト
  window.addEventListener("click", dismiss);
  window.addEventListener("keydown", dismiss);
  window.addEventListener("touchstart", dismiss, {passive:true});
})();

/* 自動再生制限で音が出せなかった場合の保険：
   最初のユーザー操作で、環境音がONなのに鳴っていなければ開始する。 */
(function(){
  function unlock(){
    if(window.ambientEnabled!==false && ambientAudio && !ambientAudio.running){
      ambientAudio.start(window.ambientType || "komorebi", 2);
    }
    window.removeEventListener("pointerdown", unlock);
    window.removeEventListener("keydown", unlock);
  }
  window.addEventListener("pointerdown", unlock);
  window.addEventListener("keydown", unlock);
})();

/* #main の中身が差し替わるたびに、子要素のフェードインを付け直す。
   （同じ要素が使い回されてもアニメが再生されるようにする） */
(function(){
  const main = document.getElementById("main");
  if(!main) return;
  const applyFade = ()=>{
    for(const child of main.children){
      child.style.animation="none";
      // 強制リフロー：これでアニメがリセットされ、次の行で再生される
      void child.offsetWidth;
      child.style.animation="fadeInUp .32s ease-out";
    }
  };
  const observer = new MutationObserver(applyFade);
  observer.observe(main, { childList:true });
})();

/* ============================================================
   背景に舞う桜の花びら（全画面共通・最背面）
   起動直後は散らさず、トップ画面の見出しが出終わってから開始する。
   ============================================================ */
let startSakura = function(){
  const canvas = document.getElementById("sakura");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let W=0, H=0, dpr=Math.min(window.devicePixelRatio||1, 2);

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+"px"; canvas.style.height = H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener("resize", resize);

  // 枚数は画面幅に応じて控えめに（狭い画面はより少なく）
  const COUNT = Math.max(10, Math.min(18, Math.round(W/90)));
  const petals = [];

  function rand(a,b){ return a + Math.random()*(b-a); }

  function makePetal(initial){
    return {
      x: rand(0, W),
      y: initial ? rand(0, H) : rand(-40, -8),
      size: rand(19, 32),
      speedY: rand(0.9, 1.9),          // 速めに落ちる
      drift: rand(0.4, 1.3),           // 風で右へ流れる基本の横速度
      sway: rand(0.02, 0.05),          // 左右にゆれる速さ（速く）
      swayAmp: rand(14, 32),           // ゆれ幅（大きく＝風にあおられる感じ）
      phase: rand(0, Math.PI*2),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.06, 0.06),     // くるくる回る
      opacity: rand(0.55, 0.9)         // はっきりめ
    };
  }
  for(let i=0;i<COUNT;i++){
    const p = makePetal(false);
    p.y = rand(-H*0.6, -10);   // 画面上部より上から、少しずつ入ってくる
    petals.push(p);
  }

  // 桜の花びら1枚を描く（根元は細く、先端は広がってV字の切れ込み）
  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    const s = p.size;
    ctx.beginPath();
    // 根元（下・細い）→左へふくらみながら上へ→先端左の丸い肩→中央のV字くぼみ→先端右の肩→右のふくらみ→根元へ
    ctx.moveTo(0, s*0.6);                                   // 根元（細い先）
    ctx.bezierCurveTo(-s*0.30, s*0.55, -s*0.52, s*0.10, -s*0.44, -s*0.30); // 左のふくらみ
    ctx.bezierCurveTo(-s*0.38, -s*0.52, -s*0.14, -s*0.56, -s*0.10, -s*0.44); // 先端左の丸い肩
    ctx.quadraticCurveTo(0, -s*0.30, s*0.10, -s*0.44);      // 中央のV字の切れ込み
    ctx.bezierCurveTo(s*0.14, -s*0.56, s*0.38, -s*0.52, s*0.44, -s*0.30);   // 先端右の丸い肩
    ctx.bezierCurveTo(s*0.52, s*0.10, s*0.30, s*0.55, 0, s*0.6);            // 右のふくらみ→根元へ
    ctx.closePath();
    // 中心が淡く、ふちほど濃い放射グラデーションで立体感
    const grad = ctx.createRadialGradient(0, s*0.1, s*0.05, 0, 0, s*0.7);
    grad.addColorStop(0,  "#fff0f5");
    grad.addColorStop(0.55, "#fbc0d5");
    grad.addColorStop(1,  "#ef7fa8");
    ctx.fillStyle = grad;
    ctx.fill();
    // 中央のうっすらした筋（花びらの脈）
    ctx.globalAlpha = p.opacity * 0.35;
    ctx.strokeStyle = "#e86b98";
    ctx.lineWidth = Math.max(0.6, s*0.03);
    ctx.beginPath();
    ctx.moveTo(0, s*0.5);
    ctx.quadraticCurveTo(0, 0, 0, -s*0.38);
    ctx.stroke();
    ctx.restore();
  }

  // 突風用の軽量な花びら描画（大量に描くのでグラデ・脈は省く）
  const gustColors = ["#fbc0d5","#f7a8c4","#f48fb4","#ef7fa8"];
  function drawPetalLite(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    const s = p.size;
    ctx.beginPath();
    ctx.moveTo(0, s*0.6);
    ctx.bezierCurveTo(-s*0.30, s*0.55, -s*0.52, s*0.10, -s*0.44, -s*0.30);
    ctx.bezierCurveTo(-s*0.38, -s*0.52, -s*0.14, -s*0.56, -s*0.10, -s*0.44);
    ctx.quadraticCurveTo(0, -s*0.30, s*0.10, -s*0.44);
    ctx.bezierCurveTo(s*0.14, -s*0.56, s*0.38, -s*0.52, s*0.44, -s*0.30);
    ctx.bezierCurveTo(s*0.52, s*0.10, s*0.30, s*0.55, 0, s*0.6);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.restore();
  }

  // 突風で横切る花びら（普段は空。突風のときだけ大量に生成し、画面外で消える）
  const gustPetals = [];

  // 突風の花びら1枚（画面の左上・上のあたりから、斜め右下へ吹き下ろす）
  // cx,cy は「かたまりの中心」。その周りに不規則に散らして塊感を出す。
  function makeGustPetal(cx, cy){
    const s = rand(16, 36);
    // 斜め右下向きの速度（下向き成分を強めに）。少しばらつかせて不規則に。
    const speed = rand(11, 20);
    const ang = rand(0.5, 0.95);            // ラジアン。右水平=0, 真下=π/2 の間 → 斜め下
    return {
      x: cx + rand(-160, 160),
      y: cy + rand(-160, 160),
      size: s,
      vx: Math.cos(ang)*speed,
      vy: Math.sin(ang)*speed,
      sway: rand(0.04, 0.11),
      swayAmp: rand(8, 22),
      phase: rand(0, Math.PI*2),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.24, 0.24),
      opacity: rand(0.7, 1),
      color: gustColors[Math.floor(Math.random()*gustColors.length)]
    };
  }

  // 突風を起こす：斜め上（左上〜上）から、不規則なかたまりで大量に吹き下ろす。
  // かたまりの中心をいくつか動かしながら、その周りに花びらを散らす。長め（約5〜6秒）。
  // 大画面でも覆い尽くせるよう、画面の広さに応じて枚数を増やす。
  function triggerGust(){
    if(window.petalsEnabled===false) return;   // OFFのときは吹かせない
    const areaFactor = (W*H)/(1280*720);       // 画面の広さの目安（大画面ほど大きい）
    const total = Math.round(rand(1800, 2400) * Math.max(1, areaFactor));  // 覆い尽くす量
    let launched = 0;
    // かたまりの発生源（画面上部の左寄りを、時間とともに右へ流していく）
    let t = 0;
    const launcher = setInterval(()=>{
      t += 1;
      // このタイミングのかたまり中心：左上から右へ移動しつつ、上下に不規則に揺らす
      const cx = -80 + t*rand(14, 26) + rand(-40,40);
      const cy = rand(-160, H*0.35) + Math.sin(t*0.5)*80;
      const burst = Math.round(rand(60, 90) * Math.max(1, areaFactor));   // 一度にどっと放出
      for(let i=0;i<burst && launched<total;i++){ gustPetals.push(makeGustPetal(cx, cy)); launched++; }
      if(launched>=total) clearInterval(launcher);
    }, 55);
  }
  // 長押しなど外部からも突風を呼べるように公開（確率スケジュールとは独立）
  window.triggerGust = triggerGust;

  // 次の突風を、平均約15分・ランダムな間隔で予約（1時間あたり平均4回程度）
  function scheduleGust(){
    // 5〜25分のあいだでランダム（平均15分）。固定間隔にはしない。
    const delay = rand(5*60*1000, 25*60*1000);
    setTimeout(()=>{ triggerGust(); scheduleGust(); }, delay);
  }
  scheduleGust();

  let last = performance.now();
  function tick(now){
    const dt = Math.min((now-last)/16.67, 2.5);  // 60fps基準の経過フレーム数
    last = now;
    ctx.clearRect(0,0,W,H);
    // OFFのときは何も描かず、突風の花びらも消しておく
    if(window.petalsEnabled===false){
      if(gustPetals.length) gustPetals.length = 0;
      requestAnimationFrame(tick);
      return;
    }
    // 通常の花びら
    for(const p of petals){
      p.phase += p.sway*dt;
      p.y += p.speedY*dt;
      // 基本は風で右へ流れつつ、サインカーブで大きく左右にあおられる
      p.x += (p.drift + Math.sin(p.phase)*p.swayAmp*0.06)*dt;
      p.rot += p.rotSpeed*dt;
      // 画面下・横に出たら上に戻す
      if(p.y > H+20){ Object.assign(p, makePetal(false)); }
      if(p.x < -30) p.x = W+30;
      else if(p.x > W+30) p.x = -30;
      drawPetal(p);
    }
    // 突風の花びら（右の画面外へ抜けたら配列から削除）
    for(let i=gustPetals.length-1;i>=0;i--){
      const p = gustPetals[i];
      p.phase += p.sway*dt;
      p.x += p.vx*dt;
      p.y += (p.vy + Math.sin(p.phase)*p.swayAmp*0.05)*dt;
      p.rot += p.rotSpeed*dt;
      drawPetalLite(p);
      if(p.x > W+40 || p.y > H+40 || p.y < -60){ gustPetals.splice(i,1); }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};

/* ============================================================
   環境音をコードで生成（木漏れ日＝そよ風＋鳥 / せせらぎ＝流水）。
   ブラウザの自動再生制限のため、最初のユーザー操作後に開始できる。
   種類はいつでも切り替え可能。
   ============================================================ */
let ambientAudio = (function(){
  let actx = null, master = null, running = false, birdTimer = null;
  let layer = null;          // 現在鳴っている音のノード群（切り替え時に停止する）
  let curType = "komorebi";

  function ensureContext(){
    if(actx) return true;
    try{
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0;           // 無音から始めてフェードインする
      master.connect(actx.destination);
      return true;
    }catch(e){ return false; }
  }

  function makeNoiseSource(seconds){
    const bufferSize = (seconds||2) * actx.sampleRate;
    const buf = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }

  // 現在のレイヤーを止めて片付ける
  function teardownLayer(){
    if(!layer) return;
    clearTimeout(birdTimer);
    (layer.nodes||[]).forEach(n=>{ try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect && n.disconnect(); }catch(e){} });
    layer = null;
  }

  // 木漏れ日：そよ風（丸いノイズ）＋鳥のさえずり
  function buildKomorebi(){
    const nodes = [];
    const noise = makeNoiseSource(2);
    const lp = actx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=550; lp.Q.value=0.7;
    const g = actx.createGain(); g.gain.value=0.12;
    const lfo = actx.createOscillator(); lfo.frequency.value=0.09;
    const lfoGain = actx.createGain(); lfoGain.gain.value=0.06;
    lfo.connect(lfoGain).connect(g.gain);
    noise.connect(lp).connect(g).connect(master);
    noise.start(); lfo.start();
    nodes.push(noise, lfo);
    // 鳥のさえずり
    function chirp(){
      if(!actx || !running || curType!=="komorebi") return;
      const now = actx.currentTime;
      const notes = 2 + Math.floor(Math.random()*3);
      let t = now;
      for(let i=0;i<notes;i++){
        const osc = actx.createOscillator();
        const og = actx.createGain();
        osc.type="sine";
        const base = 1800 + Math.random()*1600;
        osc.frequency.setValueAtTime(base, t);
        osc.frequency.exponentialRampToValueAtTime(base*(1.15+Math.random()*0.5), t+0.05);
        osc.frequency.exponentialRampToValueAtTime(base*0.9, t+0.12);
        const vol = 0.05 + Math.random()*0.05;
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(vol, t+0.01);
        og.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
        osc.connect(og).connect(master);
        osc.start(t); osc.stop(t+0.15);
        t += 0.09 + Math.random()*0.06;
      }
      birdTimer = setTimeout(chirp, 2000 + Math.random()*7000);
    }
    birdTimer = setTimeout(chirp, 1500 + Math.random()*2000);
    return { nodes };
  }

  // せせらぎ：小川がチョロチョロ流れる感じ（控えめな水の土台＋不規則な水滴の粒）
  function buildSeseragi(){
    const nodes = [];
    // 土台：ごく控えめな水の流れ（うるさくしない）
    const bed = makeNoiseSource(2);
    const bedBP = actx.createBiquadFilter();
    bedBP.type="bandpass"; bedBP.frequency.value=900; bedBP.Q.value=0.7;
    const bedG = actx.createGain(); bedG.gain.value=0.05;   // 小さめ
    bed.connect(bedBP).connect(bedG).connect(master);
    bed.start(); nodes.push(bed);

    // 水滴・泡：短い帯域ノイズを不規則に鳴らして「チョロチョロ／ポコポコ」感を出す
    let dropTimer = null;
    function drop(){
      if(!actx || !running || (layer && layer.type!=="seseragi")) return;
      const now = actx.currentTime;
      // 1〜3粒まとめて
      const n = 1 + Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const t = now + i*(0.03 + Math.random()*0.06);
        const src = makeNoiseSource(0.3);
        const bp = actx.createBiquadFilter();
        bp.type="bandpass";
        const f = 900 + Math.random()*2200;      // 粒ごとに高さがちがう
        bp.frequency.setValueAtTime(f, t);
        bp.frequency.exponentialRampToValueAtTime(f*1.5, t+0.06);  // 上がって「チョロッ」
        bp.Q.value = 6 + Math.random()*8;
        const g = actx.createGain();
        const vol = 0.05 + Math.random()*0.07;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.10+Math.random()*0.08);
        src.connect(bp).connect(g).connect(master);
        src.start(t); src.stop(t+0.25);
      }
      // 次の粒まで不規則な短い間隔（チョロチョロ絶え間なく）
      dropTimer = setTimeout(drop, 120 + Math.random()*380);
    }
    dropTimer = setTimeout(drop, 200);
    // teardown用に、タイマーを止められるダミーノードを入れておく
    nodes.push({ stop(){ clearTimeout(dropTimer); }, disconnect(){} });
    return { nodes };
  }

  // 潮騒：波が寄せては返す（ゆっくり周期的に盛り上がって引く、崩れる瞬間はノイズが明るくなる）
  function buildShiosai(){
    const nodes = [];
    // 波の土台（ゴーッという広帯域の量感。低域に寄せすぎない＝風にしない）
    const bed = makeNoiseSource(2);
    const bedBP = actx.createBiquadFilter();
    bedBP.type="bandpass"; bedBP.frequency.value=1000; bedBP.Q.value=0.35;
    const bedHP = actx.createBiquadFilter();
    bedHP.type="highpass"; bedHP.frequency.value=250;   // こもった低音だけにならないようにする
    const bedG = actx.createGain(); bedG.gain.value=0.001;
    bed.connect(bedBP).connect(bedHP).connect(bedG).connect(master);
    bed.start();
    nodes.push(bed);

    // 泡のシュワシュワ（崩れたあと、高域ノイズがゆっくり自然にゆらぎながら消えていく）
    const fizz = makeNoiseSource(2);
    const fizzHP = actx.createBiquadFilter();
    fizzHP.type="highpass"; fizzHP.frequency.value=2200;
    const fizzLP = actx.createBiquadFilter();
    fizzLP.type="lowpass"; fizzLP.frequency.value=7000;   // 上限も絞って耳に痛くしない
    // 全体の勢い（クラッシュのたびに立ち上がり、指数的にじわじわ減衰）＝一定間隔の更新はしない
    const fizzEnv = actx.createGain(); fizzEnv.gain.value = 0.0001;
    // その上に、非整数比のゆっくりしたLFOを何本か重ねて「規則的でない」自然なゆらぎを作る
    const fizzMod = actx.createGain(); fizzMod.gain.value = 0.045;
    [3.7, 5.3, 8.1].forEach((freq, i)=>{
      const lfo = actx.createOscillator(); lfo.frequency.value = freq;
      const lg = actx.createGain(); lg.gain.value = 0.30 + i*0.05;
      lfo.connect(lg).connect(fizzMod.gain);
      lfo.start();
      nodes.push(lfo);
    });
    fizz.connect(fizzHP).connect(fizzLP).connect(fizzMod).connect(fizzEnv).connect(master);
    fizz.start();
    nodes.push(fizz);

    // 砕ける瞬間：広帯域のノイズが一気に立ち上がる「ザッパーン」
    function crash(peakVol){
      const now = actx.currentTime;
      const src = makeNoiseSource(1.0);
      const hp = actx.createBiquadFilter();
      hp.type="highpass"; hp.frequency.value=350;      // 広帯域（狭いバンドパスにしない）
      const lp = actx.createBiquadFilter();
      lp.type="lowpass"; lp.frequency.value=6500;
      const g = actx.createGain();
      const vol = peakVol*1.5;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(vol, now+0.09);     // 一気に砕ける（速い立ち上がり）
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.7);   // すっと引く
      src.connect(hp).connect(lp).connect(g).connect(master);
      src.start(now); src.stop(now+1.2);
      nodes.push(src);
      // 泡のシュワシュワを、なめらかな山（すっと立ち上がりゆっくり消える）で鳴らす
      fizzEnv.gain.cancelScheduledValues(now);
      fizzEnv.gain.setValueAtTime(Math.max(fizzEnv.gain.value,0.0001), now);
      fizzEnv.gain.exponentialRampToValueAtTime(0.9, now+0.18);
      fizzEnv.gain.exponentialRampToValueAtTime(0.0001, now+2.6+Math.random()*1.2);
    }

    // 1つの波：じわっと盛り上がり、ピークで砕けて（クラッシュ＋泡）、ゆっくり引いていく
    let waveTimer = null;
    function wave(){
      if(!actx || !running || (layer && layer.type!=="shiosai")) return;
      const now = actx.currentTime;
      const rise = 2.0 + Math.random()*1.6;      // 寄せる時間
      const fall = 3.2 + Math.random()*2.4;      // 引く時間
      const peakVol = 0.11 + Math.random()*0.06;

      bedG.gain.cancelScheduledValues(now);
      bedG.gain.setValueAtTime(Math.max(bedG.gain.value,0.001), now);
      bedG.gain.exponentialRampToValueAtTime(peakVol, now+rise);
      bedG.gain.exponentialRampToValueAtTime(0.015, now+rise+fall);

      // ピークのタイミングで「砕ける」
      setTimeout(()=>{ if(running && layer && layer.type==="shiosai") crash(peakVol); }, rise*1000);

      // 次の波まで：一定のリズム感は保ちつつ、毎回かなり不規則にする（たまに間が空く「凪」も）
      const base = (rise+fall)*1000;
      const jitter = (Math.random()-0.5)*2 * base*0.35;     // ±35%程度ばらつかせる
      const lull = Math.random()<0.15 ? base*(0.4 + Math.random()*0.5) : 0;  // まれに長い間隔（凪）
      waveTimer = setTimeout(wave, Math.max(1800, base*0.55 + jitter + lull));
    }
    waveTimer = setTimeout(wave, 300);
    nodes.push({ stop(){ clearTimeout(waveTimer); }, disconnect(){} });
    return { nodes };
  }

  function buildLayer(type){
    if(type==="seseragi") return buildSeseragi();
    if(type==="shiosai") return buildShiosai();
    return buildKomorebi();
  }

  // 指定した種類で開始（またはフェードイン）。ユーザー操作後に呼ぶ。
  function start(type, fadeSec){
    if(type) curType = type;
    if(!ensureContext()) return;
    if(actx.state === "suspended") actx.resume();
    // すでに鳴っていて種類が同じなら何もしない
    if(running && layer && layer.type===curType) return;
    teardownLayer();
    running = true;
    layer = buildLayer(curType);
    layer.type = curType;
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0.9, now + (fadeSec||3));
  }
  // 種類を切り替える（鳴っていなければ何もしない）
  function setType(type, fadeSec){
    curType = type;
    if(!running) return;
    teardownLayer();
    layer = buildLayer(curType);
    layer.type = curType;
  }
  function stop(fadeSec){
    if(!actx || !running) return;
    running = false;
    teardownLayer();
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + (fadeSec||1));
  }
  return { start, setType, stop, get running(){ return running; } };
})();

/* トップ画面の見出し「SOCIETAS」をクリックすると突風を起こす
   （確率スケジュールとは独立の裏ワザ）。 */
(function(){
  const title = document.querySelector("#homeScreen .home-title");
  if(!title) return;
  title.style.cursor = "pointer";
  title.addEventListener("click", ()=>{
    if(typeof window.triggerGust==="function") window.triggerGust();
  });
})();
</script>
