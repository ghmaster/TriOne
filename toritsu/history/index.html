<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HISTORIA</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel-2:#232732; --line:#2c313c;
    --ink:#e8eaed; --sub:#9aa2ad; --accent:#c9a24b; --ok:#4a9d7f; --miss:#c1655a;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(900px 500px at 80% -10%, rgba(201,162,75,.06), transparent 60%),var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;min-height:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:24px 28px 80px}
  /* 背景に流れる波（全画面の最背面・操作を邪魔しない） */
  #bgWaveCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #homeScreen,#historyApp,#soonScreen,#sophiaScreen{position:relative;z-index:1}
  /* 起動スプラッシュ：波の背景は下の全画面共通canvasが透けて見える（自身は透明の重ね窓） */
  #splash{position:fixed;inset:0;z-index:100;background:transparent;
    display:flex;align-items:center;justify-content:center;
    opacity:1;cursor:pointer;overflow:hidden}
  #splash.out{animation:splashOut .6s ease-in forwards}
  #splashTitle{position:relative;z-index:1;color:var(--accent);font-size:clamp(38px,9vw,84px);font-weight:700;
    letter-spacing:.22em;padding-left:.22em;
    opacity:0;animation:titleIn 1.4s ease-out .8s forwards}
  @keyframes titleIn{ from{opacity:0} to{opacity:1} }
  @keyframes splashOut{ from{opacity:1} to{opacity:0} }

  /* 連続学習日数アニメーション：前日までの数字が左へ流れ、今日の数字が右から入ってくる */
  #streakAnim{position:fixed;inset:0;z-index:110;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:transparent;overflow:hidden}
  #streakAnim.show{display:flex}
  .streak-anim-inner{position:relative;width:100%;height:min(34vw,220px);
    display:flex;align-items:center;justify-content:center}
  .streak-num{position:absolute;font-size:clamp(80px,22vw,180px);font-weight:800;
    color:var(--accent);letter-spacing:.02em;text-shadow:0 0 40px rgba(201,162,75,.35)}
  .streak-num-old{animation:streakOut .7s ease-in forwards}
  .streak-num-new{transform:translateX(120%);opacity:0;animation:streakIn .7s ease-out .18s forwards}
  @keyframes streakOut{ from{transform:translateX(0);opacity:1} to{transform:translateX(-130%);opacity:0} }
  @keyframes streakIn{ to{transform:translateX(0);opacity:1} }
  .streak-anim-label{margin-top:6px;font-size:15px;letter-spacing:.14em;color:var(--sub);
    opacity:0;animation:streakLabelIn .6s ease-out 1s forwards}
  @keyframes streakLabelIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  #main>*{animation:fadeInUp .32s ease-out}
  #main{flex:1;overflow-y:auto;min-height:0;padding-bottom:60px}
  #historyApp{height:100vh;flex-direction:column;justify-content:flex-start;padding-top:24px;padding-bottom:0;overflow:hidden}
  header{margin:8px 2px 20px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:22px;letter-spacing:.06em;font-weight:700}
  .brand .tag{font-size:11px;color:var(--accent);letter-spacing:.16em;border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .brand-stat{font-size:12px;color:var(--accent);letter-spacing:.08em;
    border:1px solid rgba(201,162,75,.4);background:none;padding:6px 13px;border-radius:999px;
    cursor:pointer;transition:.15s}
  .brand-stat:hover{border-color:var(--accent);background:rgba(201,162,75,.08)}
  /* ===== 習熟度ダッシュボードの行 ===== */
  #masteryList{margin-bottom:20px}
  .mst-row{padding:9px 0}
  .mst-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
  .mst-name{font-size:14px;color:var(--ink)}
  .mst-val{font-size:11px;color:var(--sub);white-space:nowrap}
  .mst-bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .mst-fill{height:100%;border-radius:99px;transition:width .5s ease-out}
  .mst-fill.weak{background:var(--miss)}
  .mst-fill.mid{background:var(--accent)}
  .mst-fill.strong{background:var(--ok)}
  .mst-row.untouched .mst-name{color:var(--sub)}
  .mst-row.untouched .mst-bar{background:var(--line)}
  .lead{color:var(--sub);font-size:13px;margin-top:6px}

  .section-label{font-size:14px;color:var(--sub);letter-spacing:.12em;margin:20px 2px 10px}
  .eras{display:flex;flex-wrap:wrap;gap:10px}
  .era-btn{background:var(--panel);border:1px solid var(--line);color:var(--sub);
    padding:11px 18px;border-radius:11px;font-size:15px;cursor:pointer;transition:.15s}
  .era-btn:hover{border-color:var(--accent);color:var(--ink)}
  .era-btn.active{background:var(--panel-2);border-color:var(--accent);color:var(--ink)}
  .era-btn .cnt{color:var(--accent);font-size:13px;margin-left:6px}
  .mix-btn{}

  /* ===== HISTORIA：歴史のタイムライン（時代選択） ===== */
  .timeline{position:relative;margin:6px 2px 10px}
  /* 縦の金の背骨（ノードのドットを貫く） */
  .timeline::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:2px;
    background:linear-gradient(180deg,transparent,rgba(201,162,75,.30) 10%,rgba(201,162,75,.30) 90%,transparent)}
  .tl-node{position:relative}
  .tl-head{display:flex;align-items:center;gap:14px;width:100%;
    background:none;border:none;cursor:pointer;text-align:left;
    padding:11px 6px;color:var(--sub);transition:.15s}
  .tl-dot{box-sizing:border-box;flex:0 0 auto;width:14px;height:14px;border-radius:50%;
    background:var(--bg);border:2px solid var(--line);position:relative;z-index:1;transition:.2s}
  .tl-name{flex:1;font-size:16px;font-weight:600;letter-spacing:.03em;transition:.15s}
  .tl-cnt{font-size:11px;color:var(--sub);opacity:.75;font-variant-numeric:tabular-nums}
  .tl-head:hover .tl-name{color:var(--ink)}
  .tl-head:hover .tl-dot{border-color:var(--accent)}
  .tl-node.active .tl-dot{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(201,162,75,.14),0 0 12px rgba(201,162,75,.55)}
  .tl-node.active .tl-name{color:var(--accent)}
  /* 全時代MIX ノードは特別（ひし形ドット＋常時ゴールドの名前、上に区切り） */
  .tl-node.mix{margin-top:6px;padding-top:6px;border-top:1px solid rgba(44,49,60,.6)}
  .tl-node.mix .tl-dot{border-radius:3px;transform:rotate(45deg)}
  .tl-node.mix .tl-name{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:14px}
  /* ★ 今日のおすすめノード（最上部・金色で目立たせる） */
  .tl-node.rec{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(44,49,60,.6)}
  .tl-node.rec .tl-dot{background:var(--accent);border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(201,162,75,.14),0 0 12px rgba(201,162,75,.55)}
  .tl-node.rec .tl-name{color:var(--accent);font-weight:700;letter-spacing:.04em}
  .tl-node.rec .tl-cnt{color:var(--sub)}
  .rec-intro .rec-reason{font-size:14px;color:var(--sub);line-height:1.8;max-width:340px;margin:6px auto 22px}
  /* ノード直下に展開する出題モード */
  .node-modes{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px 28px;
    animation:homeFadeIn .28s ease-out}
  .node-modes:empty{display:none}
  /* クイズ中：タイムラインを隠し、問題スライドを画面中央に大きく出す */
  #historyApp.playing > .timeline{display:none}
  #historyApp.playing:not(.listmode) #main{display:flex;flex-direction:column;justify-content:safe center}
  /* 選択画面（タイムライン表示中）は、下の待機スライドと進捗バーを消してタイムラインだけにする */
  #historyApp:not(.playing) > .status,
  #historyApp:not(.playing) > .bar,
  #historyApp:not(.playing) > #main{display:none}
  #historyApp:not(.playing) > .timeline{flex:1;overflow-y:auto;min-height:0}

  /* ===== 並び替え問題 ===== */
  .sort-btn{border-color:var(--accent)}

  /* ===== 記述問題 ===== */
  .write-btn{border-color:var(--accent)}
  .write-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 20px}
  .write-head{margin-bottom:18px}
  .write-era{font-size:13px;color:var(--accent);letter-spacing:.04em;margin-bottom:10px}
  .write-q{font-size:16px;color:var(--ink);line-height:1.7;font-weight:600}
  .write-q.small{font-size:14px;font-weight:600;color:var(--sub);line-height:1.6;margin-bottom:20px}
  .write-input{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font-size:15px;line-height:1.7;padding:14px;resize:vertical;font-family:inherit}
  .write-input:focus{outline:none;border-color:var(--accent)}
  .write-submit{width:100%;margin-top:14px;padding:14px;border-radius:12px;font-size:16px;font-weight:700;
    background:var(--accent);border:none;color:#1a1a1a;cursor:pointer;transition:.15s}
  .write-submit:hover{filter:brightness(1.08)}
  .write-result{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 20px}
  .write-block{margin-bottom:20px}
  .write-label{font-size:12px;color:var(--sub);letter-spacing:.06em;margin-bottom:8px}
  .write-label.gold{color:var(--accent)}
  .write-mine{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
  .write-model{background:rgba(201,162,75,.08);border:1px solid var(--accent);border-radius:10px;padding:14px;font-size:14px;line-height:1.8;color:var(--ink)}
  .kw-list{display:flex;flex-wrap:wrap;gap:8px}
  .kw-chip{background:var(--panel-2);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600}
  .write-hint{font-size:12px;color:var(--sub);margin-top:10px}
  .write-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .write-next{padding:14px;border-radius:12px;font-size:16px;font-weight:700;background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);cursor:pointer}
  .write-again{padding:12px;border-radius:12px;font-size:14px;background:none;border:1px solid var(--line);color:var(--sub);cursor:pointer}
  .write-again:hover{border-color:var(--accent);color:var(--ink)}

  /* ===== 待機画面（時代選択後） ===== */
  .standby{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:290px;justify-content:center}
  .standby-era{font-size:38px;font-weight:800;letter-spacing:.08em;color:var(--ink)}
  .standby-mode{font-size:16px;color:var(--accent);letter-spacing:.04em}
  .standby-hint{font-size:14px;color:var(--sub)}
  .standby-start{margin-top:8px;padding:16px 56px;border-radius:14px;font-size:20px;font-weight:800;letter-spacing:.1em;
    background:var(--accent);border:none;color:#1a1a1a;cursor:pointer;transition:.15s}
  .standby-start:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .sort-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 20px;
    min-height:290px;display:flex;flex-direction:column;justify-content:center}
  .sort-head{text-align:center;margin-bottom:20px}
  .sort-era{font-size:13px;color:var(--accent);letter-spacing:.04em;margin-bottom:6px}
  .sort-inst{font-size:15px;color:var(--ink);font-weight:600}
  .sort-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .sort-slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
    background:var(--panel-2);border:1px dashed var(--line);min-height:48px}
  .sort-slot.filled{border-style:solid;border-color:var(--accent);cursor:pointer}
  .sort-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a1a1a;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .sort-slot-label{font-size:14px;color:var(--ink)}
  .sort-slot-empty{color:var(--sub);font-size:14px}
  .sort-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .sort-choice{padding:14px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);font-size:14px;text-align:left;cursor:pointer;transition:.15s}
  .sort-choice:hover{border-color:var(--accent)}
  .sort-reset{width:100%;padding:10px;border-radius:10px;background:none;border:1px solid var(--line);
    color:var(--sub);font-size:13px;cursor:pointer}
  .sort-reset:hover{border-color:var(--accent);color:var(--ink)}
  .sort-result{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 22px;text-align:center}
  .sort-verdict{font-size:26px;font-weight:800;margin-bottom:22px}
  .sort-verdict.ok{color:var(--ok)}
  .sort-verdict.ng{color:var(--miss)}
  .sort-ans-title{font-size:13px;color:var(--sub);margin-bottom:12px;letter-spacing:.06em}
  .sort-ans-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;text-align:left}
  .sort-ans-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel-2);border-radius:10px}
  .sort-ans-row span:nth-child(2){flex:1;font-size:14px;color:var(--ink)}
  .sort-ans-note{font-size:12px;color:var(--accent)}
  .sort-next,.sort-result .secondary{padding:12px 28px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--accent);color:var(--ink)}
  .sort-result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .sort-next.secondary{background:none;border-color:var(--line);color:var(--sub)}
  .sort-next.secondary:hover{border-color:var(--accent);color:var(--ink)}
  .mix-setup{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 26px;text-align:center}
  .mix-setup h2{font-size:20px;margin-bottom:10px}
  .mix-setup p{color:var(--sub);font-size:13px;margin-bottom:22px;line-height:1.7}
  .mix-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
  .mix-row label{font-size:14px;color:var(--sub)}
  .mix-row input{width:110px;background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    font-size:22px;font-weight:700;text-align:center;padding:10px 12px;border-radius:12px}
  .mix-max{font-size:13px;color:var(--sub)}
  .mix-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
  .mix-chip{background:var(--panel-2);border:1px solid var(--line);color:var(--sub);
    padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
  .mix-chip:hover{border-color:var(--accent);color:var(--ink)}
  .mix-start{background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    padding:13px 30px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer}
  .mix-start:hover{background:rgba(201,162,75,.15)}

  .modes{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;min-height:88px;align-content:flex-start}
  .mode-btn{background:var(--panel);border:1px solid var(--line);color:var(--sub);
    padding:11px 17px;border-radius:11px;font-size:14px;cursor:pointer;transition:.15s}
  .mode-btn:hover{border-color:var(--accent);color:var(--ink)}
  .mode-btn.active{background:var(--panel-2);border-color:var(--accent);color:var(--ink)}
  .review-btn.has{color:var(--miss)}
  .review-btn .cnt{color:var(--accent);font-size:13px;margin-left:5px}
  .review-btn.has .cnt{color:var(--miss)}

  .status{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px;font-size:12px;color:var(--sub)}
  .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 2px 20px}
  .bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

  .stage{perspective:1400px;margin-bottom:14px}
  .card{position:relative;width:100%;min-height:264px;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
  .card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:30px 26px;display:flex;flex-direction:column}
  .face .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent)}
  .face .body{flex:1;display:flex;align-items:center}
  .q-text{font-size:21px;font-weight:600;line-height:1.7}
  .a-text{font-size:28px;font-weight:700;color:var(--accent);line-height:1.55}
  .face .note{font-size:13px;color:var(--sub);margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .back{transform:rotateY(180deg)}
  .hint-flip{font-size:12px;color:var(--sub);text-align:center;margin-top:2px}

  .judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .judge button{padding:15px;border-radius:13px;border:1px solid var(--line);
    font-size:15px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--ink);transition:.15s}
  .judge .miss{border-color:rgba(193,101,90,.5)}
  .judge .miss:hover{background:rgba(193,101,90,.15)}
  .judge .ok{border-color:rgba(74,157,127,.5)}
  .judge .ok:hover{background:rgba(74,157,127,.15)}
  .judge button:disabled{opacity:.35;cursor:default}

  .done{text-align:center;padding:40px 20px;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .done h2{font-size:20px;margin-bottom:10px}
  .done p{color:var(--sub);font-size:14px;margin-bottom:20px}
  .done .score{font-size:44px;font-weight:800;color:var(--accent);margin:6px 0}
  .done button{background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    padding:12px 26px;border-radius:12px;font-size:14px;cursor:pointer;margin:4px}
  .done button.secondary{border-color:var(--line);color:var(--sub)}

  /* 一覧表示 */
  .list-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
    min-height:290px;display:flex;flex-direction:column;justify-content:center}
  /* 検索付き一覧は上詰め＋検索バーを上端固定 */
  .list-wrap.searchable{justify-content:flex-start}
  .list-search{position:sticky;top:0;z-index:5;background:var(--panel);
    padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .list-search input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-size:14px;padding:10px 12px;box-sizing:border-box}
  .list-search input:focus{outline:none;border-color:var(--accent)}
  .list-search .clear{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:8px;
    color:var(--sub);font-size:12px;padding:8px 10px;cursor:pointer}
  .list-search .clear:hover{border-color:var(--accent);color:var(--ink)}
  .list-results{flex:1}
  .list-empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px}
  .list-group{padding:6px 0}
  .list-group-head{font-size:11px;letter-spacing:.12em;color:var(--accent);padding:12px 20px 6px;border-top:1px solid var(--line)}
  .list-group:first-child .list-group-head{border-top:none}
  .list-item{display:flex;gap:14px;padding:11px 20px;border-top:1px solid rgba(44,49,60,.5)}
  .list-item:first-of-type{border-top:none}
  .list-q{flex:1;font-size:14px;color:var(--ink);line-height:1.6}
  .list-a{flex:0 0 auto;max-width:42%;text-align:right;font-size:14px;font-weight:700;color:var(--accent);line-height:1.6}
  .list-count{font-size:12px;color:var(--sub);padding:14px 20px;border-top:1px solid var(--line)}
  .list-hit{background:rgba(201,162,75,.28);border-radius:3px;padding:0 1px}

  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:28px;line-height:1.8}
  .foot b{color:var(--accent);font-weight:600}

  /* ===== トップ画面（ホーム） ===== */
  .home-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:0;padding-bottom:40px}
  .home-header{text-align:center;margin-bottom:64px}
  .home-title{font-size:clamp(48px,9vw,72px);letter-spacing:.16em;font-weight:700;color:var(--accent)}
  .home-sub{color:var(--sub);font-size:13px;margin-top:16px;letter-spacing:.14em}
  /* 起動直後の順次フェードイン：intro クラスで最初から非表示＆一時停止にしておき、
     スプラッシュが消え始める瞬間に play クラスを付けて初めて再生する。
     （スプラッシュを透明にしたため、ここで確実に隠しておかないと透けて重なって見える）
     ※ カード自体（すりガラスの器）は、薄くなりながら現れるとぼかしも一緒に薄くなって
     一瞬クリアに見えてしまうため、非表示→出現の瞬間にパッと不透明度100%へ切り替える
     （transition-delayによる0秒トランジション＝遅延だけつけた瞬間切り替え）。
     中身（アイコン・文字）はその上に滑らかにフェードインさせる。 */
  #homeScreen.intro .home-title,
  #homeScreen.intro .home-sub,
  #homeScreen.intro .subject-glass > *,
  #homeScreen.intro .study-cal > *,
  #homeScreen.intro .sophia-btn{opacity:0;animation:homeFadeIn .9s ease-out forwards;animation-play-state:paused}
  #homeScreen.intro .home-title{animation-delay:.5s}
  #homeScreen.intro .home-sub{animation-delay:1.5s}
  #homeScreen.intro .subject-glass > *{animation-delay:1.9s}
  #homeScreen.intro .study-cal > *{animation-delay:2.1s}
  #homeScreen.intro .sophia-btn{animation-delay:2.3s}
  #homeScreen.intro .subjects{opacity:0}
  #homeScreen.intro.play .subjects{opacity:1;transition:opacity 0s step-end 1.9s}
  #homeScreen.intro .study-cal{opacity:0}
  #homeScreen.intro.play .study-cal{opacity:1;transition:opacity 0s step-end 2.1s}
  #homeScreen.intro.play .home-title,
  #homeScreen.intro.play .home-sub,
  #homeScreen.intro.play .subject-glass > *,
  #homeScreen.intro.play .study-cal > *,
  #homeScreen.intro.play .sophia-btn{animation-play-state:running}
  @keyframes homeFadeIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  /* HISTORIA画面の順次フェードイン：HISTORIA → 時代を選ぶ → 出題モード → スライド */
  #historyApp.intro > header,
  #historyApp.intro > .section-label,
  #historyApp.intro > .eras,
  #historyApp.intro > .modes,
  #historyApp.intro > .timeline,
  #historyApp.intro > .status,
  #historyApp.intro > .bar,
  #historyApp.intro > #main{opacity:0;animation:homeFadeIn .7s ease-out forwards}
  #historyApp.intro > header{animation-delay:.1s}
  #historyApp.intro > .timeline{animation-delay:.6s}
  #historyApp.intro > .section-label:nth-of-type(1){animation-delay:.7s}
  #historyApp.intro > .eras{animation-delay:.7s}
  #historyApp.intro > .section-label:nth-of-type(3){animation-delay:1.2s}
  #historyApp.intro > .modes{animation-delay:1.2s}
  #historyApp.intro > .status{animation-delay:1.7s}
  #historyApp.intro > .bar{animation-delay:1.7s}
  #historyApp.intro > #main{animation-delay:1.7s}
  .subjects{display:flex;flex-direction:row;gap:18px}
  .subject-glass{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:52px 12px;min-height:190px;
    background:rgba(255,255,255,0.025);
    backdrop-filter:blur(5px) saturate(130%);
    -webkit-backdrop-filter:blur(5px) saturate(130%);
    border:1px solid rgba(201,162,75,0.32);border-radius:18px;
    cursor:pointer;transition:.22s;
    will-change:backdrop-filter;transform:translateZ(0);
  }
  .subject-glass:hover{
    background:rgba(255,255,255,0.08);
    border-color:var(--accent);
    transform:translateY(-3px) translateZ(0);
  }
  .subject-crest{width:170px;height:170px;margin-bottom:2px}
  .subject-crest svg{width:100%;height:100%}
  .subject-crest img{width:100%;height:100%;object-fit:contain}
  .subject-glass .subject-jp{font-size:28px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
  .subject-glass .subject-en{font-size:11px;letter-spacing:.24em;color:var(--accent)}
  .sophia-btn{display:block;margin:40px auto 0;padding:10px 0;background:none;border:none;
    color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.3em;cursor:pointer;
    transition:.2s;text-align:center}
  .sophia-btn:hover{letter-spacing:.4em}

  /* ===== 学習カレンダー：右上のストリークバッジ＋クリックで開く全画面モーダル ===== */
  .study-cal, .study-time-badge{
    position:fixed;right:18px;z-index:39;
    box-sizing:border-box;min-width:108px;text-align:center;
    padding:7px 12px;
    background:rgba(255,255,255,0.025);
    backdrop-filter:blur(5px) saturate(130%);
    -webkit-backdrop-filter:blur(5px) saturate(130%);
    border:1px solid rgba(201,162,75,0.32);border-radius:16px;
    cursor:pointer;transition:.2s;
  }
  .study-cal{top:66px;}
  .study-time-badge{top:100px;}
  /* 起動時は intro で隠しておき、スプラッシュが消えてホームが出る瞬間に play を付けてフェードイン
     （設定ボタンと同じ仕組み。固定タイマーだとスプラッシュ中に出てしまうため） */
  .study-cal.intro, .study-time-badge.intro{opacity:0;animation:homeFadeIn .8s ease-out forwards;animation-play-state:paused}
  .study-cal.intro{animation-delay:2.0s}
  .study-time-badge.intro{animation-delay:2.15s}
  .study-cal.intro.play, .study-time-badge.intro.play{animation-play-state:running}
  .study-cal:hover, .study-time-badge:hover{background:rgba(255,255,255,0.06);border-color:var(--accent)}
  .study-cal-streak, .study-time-val{font-size:10px;letter-spacing:.02em;color:var(--accent);font-weight:700;white-space:nowrap}

  /* 全画面モーダル */
  #studyCalModal, #studyTimeModal, #masteryModal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);
    display:none;align-items:center;justify-content:center;padding:24px}
  #studyCalModal.open, #studyTimeModal.open, #masteryModal.open{display:flex}
  .study-modal-panel{position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:36px;max-width:920px;width:100%;max-height:86vh;overflow-y:auto;
    box-shadow:var(--shadow)}
  .study-modal-panel h2{font-size:20px;letter-spacing:.1em;color:var(--ink);margin-bottom:8px}
  .study-modal-note{font-size:13px;color:var(--sub);margin-bottom:24px;letter-spacing:.02em}
  .study-modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;
    background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;line-height:1;transition:.15s}
  .study-modal-close:hover{color:var(--accent)}
  .study-modal-grid{
    display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;
    gap:4px;overflow-x:auto;padding-bottom:8px;
  }
  .study-modal-grid i{display:block;width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.05)}
  .study-modal-grid i.future{background:transparent}
  .study-modal-grid i.lvl0{background:rgba(255,255,255,.05)}
  .study-modal-grid i.lvl1{background:rgba(201,162,75,.28)}
  .study-modal-grid i.lvl2{background:rgba(201,162,75,.5)}
  .study-modal-grid i.lvl3{background:rgba(201,162,75,.74)}
  .study-modal-grid i.lvl4{background:rgba(201,162,75,1)}
  .study-cal-legend{display:flex;align-items:center;gap:4px;margin-top:14px;
    font-size:11px;color:var(--sub);letter-spacing:.04em}
  .study-cal-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .study-cal-legend i.lvl0{background:rgba(255,255,255,.05)}
  .study-cal-legend i.lvl1{background:rgba(201,162,75,.28)}
  .study-cal-legend i.lvl2{background:rgba(201,162,75,.5)}
  .study-cal-legend i.lvl3{background:rgba(201,162,75,.74)}
  .study-cal-legend i.lvl4{background:rgba(201,162,75,1)}

  /* ===== Coming Soon 画面 ===== */
  .soon-wrap{padding-top:24px;min-height:70vh;display:flex;flex-direction:column}
  .soon-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  .soon-label{font-size:13px;letter-spacing:.28em;color:var(--accent)}
  .soon-text{font-size:44px;font-weight:800;letter-spacing:.04em}
  .soon-note{color:var(--sub);font-size:13px}
  .brand{align-items:center}
  /* 設定ボタン（右上・白の3本線。すべての画面で表示） */
  #settingsBtn{position:fixed;top:18px;right:18px;z-index:40;
    width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
    background:none;border:none;cursor:pointer;padding:10px}
  #settingsBtn span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:.2s}
  #settingsBtn:hover span{background:var(--accent)}
  #settingsBtn.intro{opacity:0;animation:homeFadeIn .8s ease-out 2.6s forwards;animation-play-state:paused}
  #settingsBtn.intro.play{animation-play-state:running}
  /* トップへ戻るボタン（左上・設定ボタンがあった位置。トップ画面以外で表示） */
  #homeBtn{position:fixed;top:18px;left:18px;z-index:40;display:none;
    width:44px;height:44px;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;padding:10px;
    color:#fff;font-size:22px;line-height:1;transition:.2s}
  #homeBtn:hover{color:var(--accent)}
  /* 設定パネル（オーバーレイ） */
  #settingsPanel{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
    display:none;align-items:flex-start;justify-content:flex-end}
  #settingsPanel.open{display:flex}
  #settingsPanel .panel{background:var(--panel);border-left:1px solid var(--line);
    width:min(320px,80vw);height:100%;padding:70px 24px 24px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  #settingsPanel .panel h2{font-size:18px;letter-spacing:.1em;color:var(--ink)}
  #settingsPanel .panel .set-note{font-size:13px;color:var(--sub);line-height:1.7}
  #settingsPanel .set-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  #settingsPanel .set-label{font-size:15px;color:var(--ink)}
  #settingsPanel .set-toggle{min-width:58px;padding:8px 0;border-radius:10px;font-size:14px;font-weight:700;
    cursor:pointer;background:var(--panel-2);border:1px solid var(--accent);color:var(--accent);transition:.15s}
  #settingsPanel .set-toggle[aria-pressed="false"]{border-color:var(--line);color:var(--sub)}
  #settingsPanel .set-block{display:flex;flex-direction:column;gap:12px}
  .ambient-embed{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel-2)}
  .ambient-embed iframe{width:100%;height:300px;border:none;display:block;background:#0e0e10}

  /* ===== 学習時間（詳細モーダル内） ===== */
  .time-grid{display:flex;gap:8px;}
  .time-cell{flex:1;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:12px 6px;text-align:center;}
  .time-val{font-size:18px;font-weight:700;color:var(--accent);}
  .time-cap{font-size:11px;color:var(--sub);margin-top:4px;}
  .time-bars{display:flex;align-items:flex-end;gap:6px;margin-top:18px;}
  .tb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tb-track{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .tb-bar{width:72%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;}
  .tb-min{font-size:10px;color:var(--sub);}
  .tb-day{font-size:11px;color:var(--sub);}
  .time-note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:16px;}
  #settingsClose{position:absolute;top:18px;right:18px;width:44px;height:44px;
    background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  #settingsClose:hover{color:var(--accent)}

  /* ===== SOPHIA（AI相談チャット） ===== */
  .sophia-wrap{height:100vh;display:flex;flex-direction:column;padding-top:24px;padding-bottom:16px;overflow:hidden}
  .sophia-sub{color:var(--sub);font-size:13px;margin:4px 2px 14px;letter-spacing:.04em;flex-shrink:0}
  .sophia-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 16px}
  .sophia-msg{max-width:82%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
  .sophia-msg.user{align-self:flex-end;background:var(--panel-2);border:1px solid var(--accent);
    color:var(--ink);border-bottom-right-radius:4px}
  .sophia-msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-bottom-left-radius:4px}
  .sophia-msg.ai .who{display:block;font-size:11px;color:var(--accent);letter-spacing:.12em;margin-bottom:6px}
  .sophia-typing{align-self:flex-start;color:var(--sub);font-size:13px;padding:2px 6px;letter-spacing:.04em}
  .sophia-input-row{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);
    padding-top:14px;flex-shrink:0}
  .sophia-input-row textarea{flex:1;resize:none;max-height:120px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:14px;padding:12px 14px;
    box-sizing:border-box;font-family:inherit;line-height:1.5}
  .sophia-input-row textarea:focus{outline:none;border-color:var(--accent)}
  .sophia-input-row button{flex-shrink:0;width:44px;height:44px;border-radius:12px;
    background:var(--accent);border:none;color:#1a1a1a;font-size:18px;font-weight:700;cursor:pointer;transition:.15s}
  .sophia-input-row button:hover{filter:brightness(1.08)}
  .sophia-input-row button:disabled{opacity:.4;cursor:default}

  /* ===== 連続正解コンボの演出 ===== */
  /* 正解が続いたときだけ画面中央上に一瞬ポップする。クイズ操作の邪魔をしないよう pointer-events は無効。 */
  #comboFlash{position:fixed;top:22%;left:0;right:0;z-index:105;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;opacity:0;}
  #comboFlash.pop{animation:comboPop 900ms ease-out;}
  #comboFlash .combo-num{font-size:64px;font-weight:800;line-height:1;
    color:var(--accent);letter-spacing:.02em;
    text-shadow:0 0 22px rgba(201,162,75,.55),0 2px 8px rgba(0,0,0,.5);}
  #comboFlash .combo-label{font-size:14px;font-weight:700;letter-spacing:.32em;
    color:var(--ink);text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #comboFlash .combo-sub{font-size:12px;letter-spacing:.14em;color:var(--sub);}
  @keyframes comboPop{
    0%  {opacity:0;transform:translateY(10px) scale(.7);}
    18% {opacity:1;transform:translateY(0)   scale(1.12);}
    32% {transform:translateY(0) scale(1);}
    72% {opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-14px) scale(.96);}
  }
  /* コンボが途切れたときの控えめなリセット表示（赤系・小さめ） */
  #comboFlash.reset .combo-num{font-size:30px;color:var(--miss);text-shadow:none;}
  #comboFlash.reset .combo-label{color:var(--sub);}
</style>
</head>
<body>

<!-- ========== 起動時スプラッシュ（アプリ名フェードイン→フェードアウト、背景は下の全画面共通canvasが透ける） ========== -->
<div id="splash">
  <div id="splashTitle">SOCIETAS</div>
</div>

<!-- ========== 連続学習日数アニメーション（起動時、初めて記録した日だけ表示） ========== -->
<div id="streakAnim">
  <div class="streak-anim-inner">
    <span class="streak-num streak-num-old" id="streakNumOld"></span>
    <span class="streak-num streak-num-new" id="streakNumNew"></span>
  </div>
  <div class="streak-anim-label" id="streakAnimLabel"></div>
</div>

<!-- ========== 連続正解コンボの一瞬ポップ表示 ========== -->
<div id="comboFlash" aria-hidden="true"></div>


<canvas id="bgWaveCanvas"></canvas>

<!-- ========== 設定ボタン（トップ画面 左上）＋設定パネル ========== -->
<button id="homeBtn" aria-label="トップへ戻る" onclick="historyBack()">←</button>
<button id="settingsBtn" class="intro" aria-label="設定"><span></span><span></span><span></span></button>
<button class="study-cal intro" id="studyCalBtn" aria-label="連続ログイン記録・学習カレンダーを開く">
  <span class="study-cal-streak" id="studyStreak">—</span>
</button>
<button class="study-time-badge intro" id="studyTimeBtn" aria-label="学習時間の詳細を見る">
  <span class="study-time-val" id="studyTimeToday">⏱ 0分</span>
</button>
<div id="settingsPanel">
  <button id="settingsClose" aria-label="閉じる">✕</button>
  <div class="panel">
    <h2>設定</h2>
    <div class="set-block">
      <span class="set-label">環境音</span>
      <div class="ambient-embed" id="ambientEmbedWrap"></div>
    </div>
  </div>
</div>

<!-- ========== 学習カレンダー（全画面モーダル） ========== -->
<div id="studyCalModal">
  <div class="study-modal-panel">
    <button class="study-modal-close" id="studyModalClose" aria-label="閉じる">✕</button>
    <h2>学習カレンダー</h2>
    <p class="study-modal-note" id="studyModalNote">—</p>
    <div class="study-modal-grid" id="studyModalGrid"></div>
    <div class="study-cal-legend">
      <span>少ない</span>
      <i class="lvl0"></i><i class="lvl1"></i><i class="lvl2"></i><i class="lvl3"></i><i class="lvl4"></i>
      <span>多い</span>
    </div>
  </div>
</div>

<!-- ========== 学習時間の詳細（全画面モーダル） ========== -->
<div id="studyTimeModal">
  <div class="study-modal-panel">
    <button class="study-modal-close" id="studyTimeModalClose" aria-label="閉じる">✕</button>
    <h2>学習時間</h2>
    <div class="time-grid">
      <div class="time-cell"><div class="time-val" id="setTimeToday">0分</div><div class="time-cap">今日</div></div>
      <div class="time-cell"><div class="time-val" id="setTimeWeek">0分</div><div class="time-cap">今週</div></div>
      <div class="time-cell"><div class="time-val" id="setTimeTotal">0分</div><div class="time-cap">累計</div></div>
    </div>
    <div class="time-bars" id="setTimeBars"></div>
    <p class="time-note">アプリを開いて操作している時間を記録します（3分以上操作がないと一時停止）。</p>
  </div>
</div>

<!-- ========== 習熟度ダッシュボード（全画面モーダル） ========== -->
<div id="masteryModal">
  <div class="study-modal-panel">
    <button class="study-modal-close" id="masteryModalClose" aria-label="閉じる">✕</button>
    <h2>習熟度</h2>
    <p class="study-modal-note" id="masteryOverall">—</p>
    <div id="masteryList"></div>
    <p class="time-note">「覚えた」を正解として、時代ごとの正答率を出しています。<span style="color:var(--miss)">赤</span>＝苦手／<span style="color:var(--accent)">金</span>＝あと少し／<span style="color:var(--ok)">緑</span>＝得意。</p>
  </div>
</div>


<!-- ========== トップ画面（ホーム）：3分野を選ぶ ========== -->
<div class="wrap home-wrap intro" id="homeScreen">
  <header class="home-header">
    <h1 class="home-title">SOCIETAS</h1>
    <p class="home-sub">分野をえらんでください</p>
  </header>

const MISSED_KEY = "societas_missed_v1";
function loadMissed(){
  try{
    const raw = localStorage.getItem(MISSED_KEY);
    if(raw){
      const data = JSON.parse(raw) || {};
      // 旧形式（並び替えを疑似カード{q,a,note:"並び替え問題"}で保存していたもの）は
      // 新フローでは扱えないので取り除く。以後は type:"sort" 形式で貯まる。
      for(const era in data){
        if(Array.isArray(data[era])){
          data[era] = data[era].filter(m=>!(m && m.type!=="sort" && m.note==="並び替え問題"));
        }
      }
      state.missedByEra = data;
    }
  }catch(e){ /* localStorageが使えない環境では無視 */ }
}
function saveMissed(){
  try{
    localStorage.setItem(MISSED_KEY, JSON.stringify(state.missedByEra));
  }catch(e){ /* 保存に失敗しても動作は続ける */ }
}

// トップ画面のヒートマップ・連続学習日数の表示に使う。
const STUDY_LOG_KEY = "societas_study_log_v1";
state.studyLog = {};
function todayKey(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function loadStudyLog(){
  try{
    const raw = localStorage.getItem(STUDY_LOG_KEY);
    if(raw) state.studyLog = JSON.parse(raw) || {};
  }catch(e){ /* localStorageが使えない環境では無視 */ }
}
function saveStudyLog(){
  try{
    localStorage.setItem(STUDY_LOG_KEY, JSON.stringify(state.studyLog));
  }catch(e){ /* 保存に失敗しても動作は続ける */ }
}
function logStudyActivity(n){
  const k = todayKey();
  state.studyLog[k] = (state.studyLog[k]||0) + (n||1);
  saveStudyLog();
}
loadStudyLog();

function studyDateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function studyLevelOf(count){
  if(!count) return 0;
  if(count<=2) return 1;
  if(count<=5) return 2;
  if(count<=9) return 3;
  return 4;
}
const STUDY_DAY_MS = 24*60*60*1000;
// 連続学習日数と、その連続記録がいつ始まったかを計算する。
// 今日はまだ解いていないこともあるので、今日が0問なら昨日を起点に数える。
function computeStudyStreak(){
  const today = new Date();
  today.setHours(0,0,0,0);
  let streak = 0;
  let cursor = new Date(today);
  if(!(state.studyLog[studyDateKey(cursor)] > 0)){
    cursor = new Date(today.getTime() - STUDY_DAY_MS);
  }
  let startDate = null;
  while(state.studyLog[studyDateKey(cursor)] > 0){
    streak++;
    startDate = new Date(cursor);
    cursor = new Date(cursor.getTime() - STUDY_DAY_MS);
  }
  return { streak, startDate };
}

// アプリを開いた時点で「今日ログインした」ことを記録する（問題を解かなくても継続日数にカウントする）。
// 今日まだ記録がなければ、記録前後のストリーク数を控えておいて、起動アニメーションに使う。
let streakAnimData = { show:false, from:0, to:0 };
(function(){
  const already = state.studyLog[todayKey()] > 0;
  if(already) return;
  const before = computeStudyStreak().streak;
  logStudyActivity();
  const after = computeStudyStreak().streak;
  streakAnimData = { show:true, from:before, to:after };
})();

(function(){
  const TICK_MS = 10000;    // 10秒ごとに加算
  const IDLE_MS = 180000;   // 3分操作が無ければ一時停止
  let lastActive = Date.now();
  let lastTick   = Date.now();
  const bump = ()=>{ lastActive = Date.now(); };
  ["pointerdown","keydown","touchstart","scroll","click"].forEach(ev=>
    document.addEventListener(ev, bump, { passive:true }));
  document.addEventListener("visibilitychange", ()=>{
    lastTick = Date.now();                         // 復帰時に取りこぼし分をまとめて数えない
    if(!document.hidden) lastActive = Date.now();
  });
  setInterval(()=>{
    const now = Date.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    if(document.hidden) return;                    // 非表示中は数えない
    if(now - lastActive > IDLE_MS) return;         // 放置中は数えない
    const k = todayKey();
    state.studyTime[k] = (state.studyTime[k] || 0) + dt;
    saveStudyTime();
    if(typeof updateStudyBadge === "function") updateStudyBadge();
  }, TICK_MS);
})();

// 秒を「◯時間◯分／◯分／◯秒」に整形
function formatDuration(sec){
  sec = Math.round(sec || 0);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  if(h > 0) return `${h}時間${m}分`;
  if(m > 0) return `${m}分`;
  return sec > 0 ? `${sec}秒` : "0分";
}
// 今週（日曜起点〜今日）の学習時間合計
function studyTimeThisWeek(){
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay();                     // 0=日
  const sunday = new Date(today.getTime() - dow*STUDY_DAY_MS);
  let s = 0;
  for(let i=0;i<=dow;i++){ const d = new Date(sunday.getTime() + i*STUDY_DAY_MS); s += state.studyTime[studyDateKey(d)] || 0; }
  return s;
}
// 設定パネルの「連続ログイン記録」と「学習時間」を最新の値で描く（パネルを開くたびに呼ぶ）
function renderStudyDetail(){
  // 学習時間（今日・今週・累計）
  const today = state.studyTime[todayKey()] || 0;
  let total = 0; for(const k in state.studyTime) total += state.studyTime[k];
  const set = (id,v)=>{ const e = document.getElementById(id); if(e) e.textContent = formatDuration(v); };
  set("setTimeToday", today); set("setTimeWeek", studyTimeThisWeek()); set("setTimeTotal", total);
  // 直近7日の棒グラフ
  const bars = document.getElementById("setTimeBars");
  if(bars){
    const base = new Date(); base.setHours(0,0,0,0);
    const wd = ["日","月","火","水","木","金","土"];
    const days = [];
    for(let i=6;i>=0;i--){ const d = new Date(base.getTime() - i*STUDY_DAY_MS); days.push({ d, sec: state.studyTime[studyDateKey(d)] || 0 }); }
    const max = Math.max(60, ...days.map(x=>x.sec));   // 最低60秒を上限の基準に（0でも潰れない）
    bars.innerHTML = days.map(x=>{
      const h = Math.round((x.sec/max)*100);
      const min = Math.round(x.sec/60);
      return `<div class="tb-col"><div class="tb-track"><div class="tb-bar" style="height:${h}%"></div></div>`+
             `<div class="tb-min">${min}</div><div class="tb-day">${wd[x.d.getDay()]}</div></div>`;
    }).join("");
  }
}

// 習熟度ダッシュボード：時代ごとの正答率を色分けバーで表示（弱点＝赤）
function renderMasteryDashboard(){
  const list=document.getElementById("masteryList");
  const overall=document.getElementById("masteryOverall");
  if(!list||!overall) return;
  const tot=state.stats.totalAnswered||0, cor=state.stats.totalCorrect||0;
  const rows = ERAS.map(e=>{
    const s = state.stats.eras[e.era] || {correct:0,total:0};
    const pct = s.total ? Math.round(s.correct/s.total*100) : null;
    return { era:e.era, total:s.total, pct };
  });
  if(tot>0){
    const answered = rows.filter(r=>r.total>0);
    let weak=null;
    answered.forEach(r=>{ if(weak===null || r.pct<weak.pct) weak=r; });
    const acc = Math.round(cor/tot*100);
    overall.innerHTML = `全体の正答率 <b style="color:var(--accent)">${acc}%</b>（累計 ${tot}問）`
      + (weak && answered.length>=2 ? ` ・ いちばん苦手は「${weak.era}」` : "");
  }else{
    overall.textContent = "まだ学習の記録がありません。問題を解くと、時代ごとの習熟度がここに出ます。";
  }
  list.innerHTML = rows.map(r=>{
    if(!r.total){
      return `<div class="mst-row untouched"><div class="mst-top"><span class="mst-name">${r.era}</span><span class="mst-val">未着手</span></div><div class="mst-bar"></div></div>`;
    }
    const lvl = r.pct<50 ? "weak" : (r.pct<80 ? "mid" : "strong");
    return `<div class="mst-row"><div class="mst-top"><span class="mst-name">${r.era}</span><span class="mst-val">${r.pct}% ・ ${r.total}問</span></div>`
      + `<div class="mst-bar"><div class="mst-fill ${lvl}" style="width:${r.pct}%"></div></div></div>`;
  }).join("");
}

/* ============================================================
   ゲーム性：戦績（習熟度・累計・最高コンボ）の記録と、連続正解コンボ
   ------------------------------------------------------------
   ・時代ごとの「正解した数 / 答えた数」を localStorage に貯めておき、
     あとで習熟度メーターや称号（Discipulus→Praetor）に使う。
   ・用語カードは自己申告（「覚えた」＝正解／「まだ」＝不正解）、
     並び替えは自動採点。どちらも recordAnswer() を通す。
   ・記述（自由記述）は自己採点で正誤があいまいなので、この記録には含めない。
   ・コンボはページを開いている間だけのカウント（正解で+1、不正解で0にリセット）。
     最高記録だけ bestCombo として保存する。
   ============================================================ */
const STATS_KEY = "societas_stats_v1";
state.stats = { eras:{}, totalCorrect:0, totalAnswered:0, bestCombo:0 };
state.combo = 0;   // 今ひらいている間の連続正解数（保存しない）

function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const s = JSON.parse(raw) || {};
      state.stats = {
        eras: s.eras || {},
        totalCorrect: s.totalCorrect || 0,
        totalAnswered: s.totalAnswered || 0,
        bestCombo: s.bestCombo || 0
      };
    }
  }catch(e){ /* localStorageが使えない環境では無視 */ }
}
function saveStats(){
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(state.stats)); }
  catch(e){ /* 保存に失敗しても動作は続ける */ }
}
loadStats();

// 時代名を正規化（全時代MIXの並び替えなどは「全時代MIX」にまとめる）
function statsEraKey(era){
  return era || "その他";
}

// 1問ぶんの結果を記録する。era＝時代名、isCorrect＝正解かどうか。
function recordAnswer(era, isCorrect){
  const key = statsEraKey(era);
  if(!state.stats.eras[key]) state.stats.eras[key] = { correct:0, total:0 };
  state.stats.eras[key].total++;
  state.stats.totalAnswered++;
  if(isCorrect){
    state.stats.eras[key].correct++;
    state.stats.totalCorrect++;
    state.combo++;
    if(state.combo > state.stats.bestCombo) state.stats.bestCombo = state.combo;
  }else{
    state.combo = 0;
  }
  saveStats();
  flashCombo(isCorrect);
}

// 連続正解コンボの一瞬ポップ表示。10問ごと（10・20・30…連続）の節目だけ数字を出す。
// 不正解でコンボが途切れたときは、10以上まで積んでいたときだけ控えめに知らせる。
let comboFlashTimer = null;
let comboBeforeMiss = 0;
function flashCombo(isCorrect){
  const el = document.getElementById("comboFlash");
  if(!el) return;
  if(comboFlashTimer){ clearTimeout(comboFlashTimer); comboFlashTimer = null; }

  if(isCorrect){
    comboBeforeMiss = state.combo;
    // 10の倍数の節目でだけ祝う
    if(state.combo === 0 || state.combo % 10 !== 0){ el.className = ""; el.innerHTML = ""; return; }
    const isBest = state.combo === state.stats.bestCombo;
    el.className = "";
    el.innerHTML =
      `<div class="combo-num">${state.combo}</div>`+
      `<div class="combo-label">Combo</div>`+
      (isBest ? `<div class="combo-sub">自己ベスト！</div>` : ``);
    // 一度クラスを外してから付け直してアニメを再生させる
    void el.offsetWidth;
    el.classList.add("pop");
  }else{
    // 途切れたとき：10以上まで積んでいたときだけ表示
    if(comboBeforeMiss >= 10){
      el.className = "reset";
      el.innerHTML =
        `<div class="combo-num">${comboBeforeMiss}</div>`+
        `<div class="combo-label">Combo 終了</div>`;
      void el.offsetWidth;
      el.classList.add("pop");
    }else{
      el.className = ""; el.innerHTML = "";
    }
    comboBeforeMiss = 0;
  }
  comboFlashTimer = setTimeout(()=>{ el.className=""; el.innerHTML=""; }, 950);
}


// 学習カレンダー（ヒートマップ）の描画。トップ画面に戻るたびに呼ばれ、最新の記録を反映する。

// 右上のバッジ：連続学習日数だけを表示する軽量版（トップ画面に戻るたびに更新）
function renderStudyCalendar(){
  const streakEl = document.getElementById("studyStreak");
  if(!streakEl) return;
  const { streak } = computeStudyStreak();
  streakEl.textContent = streak>0 ? `🔥 ${streak}日連続` : "今日から始めよう";
}

// クリックで開く全画面モーダル：長い期間のヒートマップ＋いつから連続記録が始まったか
function renderStudyCalendarModal(){
  const grid = document.getElementById("studyModalGrid");
  const note = document.getElementById("studyModalNote");
  if(!grid || !note) return;

  const WEEKS = 26; // 半年分
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayDow = today.getDay();
  const thisWeekSunday = new Date(today.getTime() - todayDow*STUDY_DAY_MS);
  const gridStart = new Date(thisWeekSunday.getTime() - (WEEKS-1)*7*STUDY_DAY_MS);

  let html = "";
  for(let i=0;i<WEEKS*7;i++){
    const d = new Date(gridStart.getTime() + i*STUDY_DAY_MS);
    if(d.getTime() > today.getTime()){
      html += `<i class="future"></i>`;
      continue;
    }
    const count = state.studyLog[studyDateKey(d)] || 0;
    const lvl = studyLevelOf(count);
    const dateLabel = `${d.getMonth()+1}/${d.getDate()}`;
    html += `<i class="lvl${lvl}" title="${dateLabel}：${count}問"></i>`;
  }
  grid.innerHTML = html;

  const { streak, startDate } = computeStudyStreak();
  if(streak>0 && startDate){
    const label = `${startDate.getMonth()+1}月${startDate.getDate()}日`;
    note.textContent = `🔥 ${streak}日連続中（${label}から継続中）`;
  }else{
    note.textContent = "まだ連続記録はありません。今日から始めよう。";
  }
}

// 起動時の連続学習日数アニメーション：前日までの数字が左へ流れ、今日の数字が右から入ってくる。
// アニメーション終了後に onDone() を呼ぶ（呼び出し側でトップ画面のフェードインを続ける）。
function showStreakAnim(from, to, onDone){
  const el = document.getElementById("streakAnim");
  const oldEl = document.getElementById("streakNumOld");
  const newEl = document.getElementById("streakNumNew");
  const label = document.getElementById("streakAnimLabel");
  if(!el || !oldEl || !newEl || !label){ if(onDone) onDone(); return; }
  oldEl.textContent = from;
  newEl.textContent = to;
  label.textContent = `${to}日連続！`;
  el.classList.add("show");
  // 数字のアニメーション（〜0.9s）とラベル表示（1s〜1.6s）を見せてから、フェードアウトして次へ
  setTimeout(()=>{
    el.style.transition = "opacity .5s ease";
    el.style.opacity = "0";
    setTimeout(()=>{
      el.classList.remove("show");
      el.style.opacity = "";
      el.style.transition = "";
      if(onDone) onDone();
    }, 500);
  }, 2200);
}


// 今選んでいる時代の「間違えた問題」配列を取り出す（なければ作る）
function curMissed(){
  if(state.eraIndex===null || state.eraIndex===undefined) return [];
  const era = ERAS[state.eraIndex].era;
  if(!state.missedByEra[era]) state.missedByEra[era] = [];
  return state.missedByEra[era];
}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 時代名の表示用の短縮ラベル（データのキーは変えず、見た目だけ「時代」を省く）
// 例：「奈良時代」→「奈良」、「江戸時代・前期」→「江戸・前期」、「古代」はそのまま
function shortEraLabel(era){
  if(era.endsWith("時代")) return era.slice(0, -2);
  return era.replace("時代", "");
}

// 時代選択を「歴史のタイムライン」で描く。
// 縦の金の線＋時代ノード（古代→江戸を上から下へ）。選択中の時代の直下に、
// その時代の出題モード（#modes プレースホルダ）をインラインで展開する。
function renderEras(){
  const box=$("#timeline"); if(!box) return;
  const app=document.getElementById("historyApp");
  if(app){
    app.classList.toggle("playing", !!state.playing);   // クイズ中はCSSでタイムライン非表示＆スライド中央寄せ
    app.classList.toggle("listmode", state.mode==="list"); // 一覧は中央寄せせず #main スクロールに任せる
  }
  box.innerHTML="";
  if(state.playing) return;   // クイズ中はタイムラインを作らない（問題スライドに専念）

  // モードをノード直下に差し込むためのプレースホルダを作る（#modes は常に1つだけ）
  const modeSlot=()=>{ const m=document.createElement("div"); m.className="node-modes"; m.id="modes"; return m; };

  // ★ 今日のおすすめ（タイムライン最上部の特別ノード）
  const recNode=document.createElement("div");
  recNode.className="tl-node rec";
  const recHead=document.createElement("button");
  recHead.className="tl-head";
  recHead.innerHTML=`<span class="tl-dot"></span>`+
                    `<span class="tl-name">★ 今日のおすすめ</span>`+
                    `<span class="tl-cnt">おまかせ</span>`;
  recHead.onclick=()=> startRecommend();
  recNode.appendChild(recHead);
  box.appendChild(recNode);

  ERAS.forEach((e,i)=>{
    const selected = (state.eraIndex===i && state.mode!=="mix");
    const node=document.createElement("div");
    node.className="tl-node"+(selected?" active":"");

    const head=document.createElement("button");
    head.className="tl-head";
    head.innerHTML=`<span class="tl-dot"></span>`+
                   `<span class="tl-name">${e.era}</span>`+
                   `<span class="tl-cnt">${e.cards.length}</span>`;
    head.onclick=()=>{
      if(state.eraIndex===i && state.mode!=="mix"){ state.eraIndex=null; }  // もう一度押すと解除
      else { state.eraIndex=i; }
      state.selected=null; state.mode="standby";
      renderEras(); renderModes(); renderStandby();
    };
    node.appendChild(head);
    if(selected) node.appendChild(modeSlot());   // 選択中の時代の下にモードを展開
    box.appendChild(node);
  });

  // 全時代MIX（タイムラインの末尾に特別ノードとして配置）
  const total = ERAS.reduce((s,e)=>s+e.cards.length,0);
  const mixActive = (state.mode==="mix" || state.mode==="mixsort");
  const mixNode=document.createElement("div");
  mixNode.className="tl-node mix"+(mixActive?" active":"");
  const mixHead=document.createElement("button");
  mixHead.className="tl-head";
  mixHead.innerHTML=`<span class="tl-dot"></span>`+
                    `<span class="tl-name">全時代MIX</span>`+
                    `<span class="tl-cnt">${total}</span>`;
  mixHead.onclick=()=>{
    if(state.mode==="mix" || state.mode==="mixsort"){
      state.eraIndex=null; state.selected=null; state.mode="standby";
      renderEras(); renderModes(); renderStandby();
    }else{ startMix(); }
  };
  mixNode.appendChild(mixHead);
  if(state.mode==="mix") mixNode.appendChild(modeSlot());   // MIXのモード（ランダム/並び替え）を展開
  box.appendChild(mixNode);
}

function renderModes(){
  const box=$("#modes"); if(!box) return; box.innerHTML="";
  // 全時代MIXモードのとき：ランダムと並び替えの2つを出す
  if(state.mode==="mix"){
    const mixDefs=[
      {key:"mixrandom",label:`ランダム`},
      {key:"mixsort",label:"並び替え問題"}
    ];
    mixDefs.forEach(d=>{
      const b=document.createElement("button");
      b.className="mode-btn"+(d.key==="mixsort"?" sort-btn":"")+(state.selected===d.key?" active":"");
      b.textContent=d.label;
      b.onclick=()=>{ if(d.key==="mixsort"){ startMixSort(); } else { state.selected="mixrandom"; renderMixStandby(); renderEras(); } };
      box.appendChild(b);
    });
    return;
  }
  // 時代が選ばれていないときは、モードボタンを出さない
  if(state.eraIndex===null || state.eraIndex===undefined){ return; }
  const cur=ERAS[state.eraIndex];
  const defs=[
    {key:"random",label:`ランダム${DRAW}問`},
    {key:"all",label:"全問"},
    {key:"list",label:"一覧で見る"}
  ];
  defs.forEach(d=>{
    const b=document.createElement("button");
    b.className="mode-btn"+(state.selected===d.key?" active":"");
    b.textContent=d.label;
    if(d.key==="list"){
      b.onclick=()=>{ showList(); };   // 押したら一覧ページへ
    }else{
      b.onclick=()=>{ start(d.key); };   // 押したら即開始（クイズ画面へ）
    }
    box.appendChild(b);
    // ランダム10問の「隣」に並び替え問題ボタンを差し込む（その時代に問題がある場合のみ）
    if(d.key==="random" && SORT_QUESTIONS[cur.era] && SORT_QUESTIONS[cur.era].length){
      const s=document.createElement("button");
      s.className="mode-btn sort-btn"+(state.selected==="sort"?" active":"");
      s.textContent="並び替え問題";
      s.onclick=()=>{ startSort(); };   // 押したら即開始
      box.appendChild(s);
    }
    // 「並び替え問題」と「全問」の間に記述問題ボタンを差し込む（その時代に問題がある場合のみ）
    if(d.key==="random" && WRITE_QUESTIONS[cur.era] && WRITE_QUESTIONS[cur.era].length){
      const w=document.createElement("button");
      w.className="mode-btn write-btn"+(state.selected==="write"?" active":"");
      w.textContent="記述問題";
      w.onclick=()=>{ startWrite(); };   // 押したら即開始
      box.appendChild(w);
    }
  });
  const n=curMissed().length;
  const r=document.createElement("button");
  r.className="mode-btn review-btn"+(n?" has":"")+(state.mode==="review"?" active":"");
  r.innerHTML=`間違えた問題<span class="cnt">${n}</span>`;
  r.onclick=()=>{
    if(state.mode==="review"){ backToStandby(); }   // もう一度押したら待機画面へ
    else if(n){ startReview(); }
  };
  box.appendChild(r);
}

/* 「モードを選び直す」→ 選択をリセットして待機画面に戻る */
function backToStandby(){
  state.playing=false;
  state.selected=null;
  state.mode="standby";
  renderEras(); renderModes(); renderStandby();
}

/* 待機画面：時代名を大きく表示。モード選択後はSTARTボタンを出す */
function renderStandby(){
  state.playing=false;
  // 時代がまだ選ばれていない場合
  if(state.eraIndex===null || state.eraIndex===undefined){
    $("#modeLabel").textContent="—";
    $("#progress").textContent="—";
    $("#barFill").style.width="0%";
    $("#main").innerHTML=`<div class="standby">
      <div class="standby-era">HISTORIA</div>
      <div class="standby-hint">時代を選んでください</div>
    </div>`;
    return;
  }
  const cur=ERAS[state.eraIndex];
  const modeLabels={random:`ランダム${DRAW}問`, all:"全問", sort:"並び替え問題", write:"記述問題"};
  const selected=state.selected;
  $("#modeLabel").textContent = selected ? `${cur.era}：${modeLabels[selected]}` : cur.era;
  $("#progress").textContent="—";
  $("#barFill").style.width="0%";

  let html=`<div class="standby">
    <div class="standby-era">${cur.era}</div>`;
  if(selected){
    html+=`<div class="standby-mode">${modeLabels[selected]}</div>
      <button class="standby-start" id="standbyStart">START</button>`;
  }else{
    html+=`<div class="standby-hint">出題モードをえらんでください</div>`;
  }
  html+=`</div>`;
  $("#main").innerHTML=html;

  if(selected){
    $("#standbyStart").onclick=()=>{
      if(selected==="sort"){ startSort(); }
      else if(selected==="write"){ startWrite(); }
      else { start(selected); }   // random / all
    };
  }
}

function start(mode){
  const cur=ERAS[state.eraIndex];
  if(!cur.cards || cur.cards.length===0){
    // カードがまだ無い時代（作成途中）はクラッシュさせず待機画面のまま知らせる
    $("#main").innerHTML=`<div class="standby"><div class="standby-era">${cur.era}</div><div class="standby-hint">この時代の用語カードは準備中です</div></div>`;
    return;
  }
  state.mode=mode;
  state.selected=mode;
  let cards=shuffle(cur.cards);
  if(mode==="random") cards=cards.slice(0,Math.min(DRAW,cur.cards.length));
  state.queue=cards.map(c=>({...c, era:cur.era}));
  begin((mode==="random"?`ランダム${state.queue.length}問`:"全問")+`｜${cur.era}`);
}

/* ============================================================
   記述問題（都立頻出の説明記述）
   自分で答えを書く → 模範解答＋キーワードを見て自己採点。
   用語カードとは別データ。既存機能には干渉しない。
   ============================================================ */
let writeState = null;

function startWrite(){
  const cur=ERAS[state.eraIndex];
  const qs = WRITE_QUESTIONS[cur.era];
  if(!qs || !qs.length) return;
  state.mode="write";
  state.playing=true;
  state.selected="write";
  writeState = {
    queue: shuffle(qs.map(q=>({...q, era:cur.era}))),
    pos: 0
  };
  $("#modeLabel").textContent=`記述問題｜${cur.era}`;
  renderEras(); renderModes();
  renderWrite();
}

function renderWrite(){
  const q = writeState.queue[writeState.pos];
  const total = writeState.queue.length;
  $("#progress").textContent=`${writeState.pos+1} / ${total}`;
  $("#barFill").style.width=(writeState.pos/total*100)+"%";
  $("#main").innerHTML=`
    <div class="write-wrap">
      <div class="write-head">
        <div class="write-era">${q.era}</div>
        <div class="write-q">${q.q}</div>
      </div>
      <textarea class="write-input" id="writeInput" placeholder="回答を入力" rows="4"></textarea>
      <button class="write-submit" id="writeSubmit">回答する</button>
    </div>`;
  $("#writeSubmit").onclick=()=>showWriteAnswer();
}

function showWriteAnswer(){
  const q = writeState.queue[writeState.pos];
  const myAnswer = ($("#writeInput").value || "").trim();
  const kwChips = q.keywords.map(k=>`<span class="kw-chip">${k}</span>`).join("");
  $("#main").innerHTML=`
    <div class="write-result">
      <div class="write-q small">${q.q}</div>

      <div class="write-block">
        <div class="write-label">あなたの答え</div>
        <div class="write-mine">${myAnswer ? escapeHtml(myAnswer) : "（未記入）"}</div>
      </div>

      <div class="write-block">
        <div class="write-label gold">都立の模範解答</div>
        <div class="write-model">${q.model}</div>
      </div>

      <div class="write-block">
        <div class="write-label">入っているとよいキーワード</div>
        <div class="kw-list">${kwChips}</div>
        <div class="write-hint">この語句が自分の答えに入っているか、見くらべてみよう。</div>
      </div>

      <div class="write-actions">
        <button class="write-next" id="writeNext">次へ</button>
        <button class="write-again secondary" id="writeReview">もう一度この問題を書く</button>
      </div>
    </div>`;
  $("#writeNext").onclick=()=>{
    logStudyActivity();
    writeState.pos++;
    if(writeState.pos>=writeState.queue.length){ finishWrite(); }
    else { renderWrite(); }
  };
  $("#writeReview").onclick=()=>renderWrite();
}

function finishWrite(){
  const total=writeState.queue.length;
  const cur=ERAS[state.eraIndex];
  $("#barFill").style.width="100%";
  $("#progress").textContent="完了";
  $("#main").innerHTML=`
    <div class="done">
      <h2>おつかれさま！</h2>
      <p>${cur.era}の記述問題（${total}問）を書き終えました。<br>模範解答と見くらべて、キーワードが入っていたか確認しよう。</p>
      <div>
        <button onclick="startWrite()">もう一度 記述問題</button>
        <button class="secondary" onclick="backToStandby()">モードを選び直す</button>
      </div>
    </div>`;
  renderModes();
}

/* ============================================================
   並び替え問題（A案：時代内で4つの出来事を古い順に並べる）
   用語カードとは別データ。間違えたら「間違えた問題」に入れる。
   ============================================================ */
let sortState = null;

function startSort(){
  const cur=ERAS[state.eraIndex];
  const qs = SORT_QUESTIONS[cur.era];
  if(!qs || !qs.length) return;
  state.mode="sort";
  state.playing=true;
  state.selected="sort";
  // この時代の並び替え問題をシャッフルして順に出す
  sortState = {
    queue: shuffle(qs.map(q=>({...q, era:cur.era}))),
    pos: 0,
    correct: 0
  };
  $("#modeLabel").textContent=`並び替え問題｜${cur.era}`;
  renderEras(); renderModes();
  renderSort();
}

/* 時代をまたぐ並び替え（全時代MIX専用） */
function startMixSort(){
  state.playing=true;
  state.mode="mixsort";
  state.selected="mixsort";
  sortState = {
    queue: shuffle(MIX_SORT_QUESTIONS.map(q=>({...q, isMix:true}))),
    pos: 0,
    correct: 0
  };
  $("#modeLabel").textContent="並び替え問題｜全時代MIX";
  renderEras(); renderModes();
  renderSort();
}

function renderSort(){
  const q = sortState.queue[sortState.pos];
  const total = sortState.queue.length;
  $("#progress").textContent=`${sortState.pos+1} / ${total}`;
  $("#barFill").style.width=(sortState.pos/total*100)+"%";
  // 選択肢をシャッフルして表示（正しい順は items の並び）
  const shuffled = shuffle(q.items.map((it,idx)=>({...it, origIndex:idx})));
  // ユーザーが選んだ順を入れる配列
  sortState.picked = [];
  sortState.shuffled = shuffled;

  let html=`<div class="sort-wrap">
    <div class="sort-head">
      <div class="sort-era">${q.isMix ? "全時代" : q.era} · ${q.theme}</div>
      <div class="sort-inst">古いものから順にタップしてください</div>
    </div>
    <div class="sort-slots" id="sortSlots"></div>
    <div class="sort-choices" id="sortChoices"></div>
    <button class="sort-reset" id="sortReset">やり直す</button>
    <button class="sort-reset" id="sortReveal">答えを見る</button>
    <button class="sort-reset" id="sortSkip">次の問題</button>
  </div>`;
  $("#main").innerHTML=html;

  renderSortSlots();
  renderSortChoices();
  $("#sortReset").onclick=()=>{ sortState.picked=[]; renderSortSlots(); renderSortChoices(); };
  $("#sortReveal").onclick=()=>{ showSortAnswer(); };   // 判定せず答えだけ表示
  $("#sortSkip").onclick=()=>{ gotoNextSort(); };       // 飛ばす（間違い扱いにしない）
}

// 判定せずに正しい順番だけを見せる（間違え箱に入れない）
function showSortAnswer(){
  const q = sortState.queue[sortState.pos];
  const rows = q.items.map((it,i)=>
    `<div class="sort-ans-row"><span class="sort-num">${i+1}</span><span>${it.label}</span><span class="sort-ans-note">${it.note}</span></div>`
  ).join("");
  $("#main").innerHTML=`
    <div class="sort-result">
      <div class="sort-ans-title">正しい順番</div>
      <div class="sort-ans-list">${rows}</div>
      <div class="sort-result-btns">
        <button class="sort-next secondary" id="sortBack">問題に戻る</button>
        <button class="sort-next" id="sortNext">次の問題</button>
      </div>
    </div>`;
  $("#sortBack").onclick=()=>{ renderSort(); };   // 同じ問題をやり直す
  $("#sortNext").onclick=()=>{ gotoNextSort(); };
}

// 次の問題へ進む（判定なし・間違い扱いにしない）
function gotoNextSort(){
  sortState.pos++;
  renderModes();
  if(sortState.pos>=sortState.queue.length){ finishSort(); }
  else { renderSort(); }
}

function renderSortSlots(){
  const slots=$("#sortSlots"); slots.innerHTML="";
  const total=sortState.shuffled.length;
  for(let i=0;i<total;i++){
    const div=document.createElement("div");
    div.className="sort-slot";
    const picked = sortState.picked[i];
    if(picked!==undefined){
      const it = sortState.shuffled[picked];
      div.innerHTML=`<span class="sort-num">${i+1}</span><span class="sort-slot-label">${it.label}</span>`;
      div.classList.add("filled");
      div.onclick=()=>{ // タップで取り消し（最後のものだけ戻せる簡易仕様）
        sortState.picked.splice(i,1);
        renderSortSlots(); renderSortChoices();
      };
    }else{
      div.innerHTML=`<span class="sort-num">${i+1}</span><span class="sort-slot-empty">？</span>`;
    }
    slots.appendChild(div);
  }
}

function renderSortChoices(){
  const box=$("#sortChoices"); box.innerHTML="";
  sortState.shuffled.forEach((it,idx)=>{
    if(sortState.picked.includes(idx)) return; // すでに選ばれたものは出さない
    const b=document.createElement("button");
    b.className="sort-choice";
    b.textContent=it.label;
    b.onclick=()=>{
      sortState.picked.push(idx);
      renderSortSlots(); renderSortChoices();
      // 全部埋まったら自動で判定
      if(sortState.picked.length===sortState.shuffled.length){
        setTimeout(judgeSort, 300);
      }
    };
    box.appendChild(b);
  });
}

function judgeSort(){
  logStudyActivity();
  const q = sortState.queue[sortState.pos];
  // ユーザーが選んだ順（origIndex）が 0,1,2,3... になっていれば正解
  const userOrder = sortState.picked.map(i=>sortState.shuffled[i].origIndex);
  const correct = userOrder.every((v,idx)=>v===idx);
  recordAnswer(q.isMix ? "全時代MIX" : q.era, correct);   // 習熟度・コンボの記録

  if(correct){
    sortState.correct++;
  }else{
    // 間違えたら「間違えた問題」に、並び替え問題そのままの形式で入れる。
    // type:"sort" で用語カードと区別し、解き直しは並び替えUIで出す。
    // 時代またぎ（isMix）の場合は "全時代MIX" の箱に入れる。
    const era = q.isMix ? "全時代MIX" : q.era;
    if(!state.missedByEra[era]) state.missedByEra[era]=[];
    const already = state.missedByEra[era].some(m=>m.type==="sort" && m.theme===q.theme && m.era===(q.era||era));
    if(!already){
      state.missedByEra[era].push({
        type:"sort",
        theme:q.theme,
        items:q.items.map(it=>({...it})),
        era:q.era||era,
        isMix:!!q.isMix
      });
    }
    saveMissed();
  }
  showSortResult(correct);
}

function showSortResult(correct){
  const q = sortState.queue[sortState.pos];
  const rows = q.items.map((it,i)=>
    `<div class="sort-ans-row"><span class="sort-num">${i+1}</span><span>${it.label}</span><span class="sort-ans-note">${it.note}</span></div>`
  ).join("");
  $("#main").innerHTML=`
    <div class="sort-result">
      <div class="sort-verdict ${correct?'ok':'ng'}">${correct?"正解！":"おしい！"}</div>
      <div class="sort-ans-title">正しい順番</div>
      <div class="sort-ans-list">${rows}</div>
      <button class="sort-next" id="sortNext">次へ</button>
    </div>`;
  $("#sortNext").onclick=()=>{
    sortState.pos++;
    renderModes();
    if(sortState.pos>=sortState.queue.length){ finishSort(); }
    else { renderSort(); }
  };
}

function finishSort(){
  const total=sortState.queue.length;
  const pct=Math.round(sortState.correct/total*100);
  $("#barFill").style.width="100%";
  $("#progress").textContent="完了";

  // 時代またぎ（全時代MIX）の場合
  if(state.mode==="mixsort"){
    const box = state.missedByEra["全時代MIX"];
    const missNow = box ? box.length : 0;
    $("#main").innerHTML=`
      <div class="done">
        <h2>おつかれさま！</h2>
        <div class="score">${sortState.correct} / ${total}</div>
        <p>並び替え問題 正解率 ${pct}%${missNow?` ・ 全時代MIXの解き直し待ち ${missNow}問`:""}</p>
        <div>
          <button onclick="startMixSort()">もう一度 並び替え問題</button>
          <button class="secondary" onclick="startMix()">モードを選び直す</button>
        </div>
      </div>`;
    renderModes();
    return;
  }

  const cur=ERAS[state.eraIndex];
  const missNow=curMissed().length;
  $("#main").innerHTML=`
    <div class="done">
      <h2>おつかれさま！</h2>
      <div class="score">${sortState.correct} / ${total}</div>
      <p>並び替え問題 正解率 ${pct}%${missNow?` ・ ${cur.era}の解き直し待ち ${missNow}問`:""}</p>
      <div>
        <button onclick="startSort()">もう一度 並び替え問題</button>
        <button class="secondary" onclick="backToStandby()">モードを選び直す</button>
      </div>
    </div>`;
  renderModes();
}

/* 全時代MIX：画面内の入力欄で出題数を決める（promptは環境により使えないため） */
function startMix(){
  state.playing=false;
  state.mode="mix";
  state.eraIndex=null;     // 時代選択は解除
  state.selected=null;     // モード未選択の状態から
  renderEras(); renderModes(); renderMixStandby();
}

/* 全時代MIXの待機画面：ランダム／並び替えを選ぶ */
function renderMixStandby(){
  const selected=state.selected;
  state.playing = (selected==="mixrandom");   // 出題数入力は集中ページ扱い（タイムラインを隠す）
  const modeLabels={mixrandom:"ランダム", mixsort:"並び替え問題"};
  $("#modeLabel").textContent = selected ? `全時代MIX：${modeLabels[selected]}` : "全時代MIX";
  $("#progress").textContent="—";
  $("#barFill").style.width="0%";

  let html=`<div class="standby">
    <div class="standby-era">全時代MIX</div>`;
  if(selected==="mixrandom"){
    // 従来のランダム（問題数入力）
    const max = ERAS.reduce((s,e)=>s+e.cards.length,0);
    html+=`<div class="standby-mode">ランダム</div>
      <div class="mix-row">
        <label for="mixNum">出題数</label>
        <input id="mixNum" type="number" min="1" max="${max}" value="20" inputmode="numeric">
        <span class="mix-max">/ ${max}</span>
      </div>
      <div class="mix-quick" id="mixQuick"></div>
      <button class="mix-start" id="mixStart">この問題数で始める</button>`;
  }else if(selected==="mixsort"){
    html+=`<div class="standby-mode">並び替え問題</div>
      <button class="standby-start" id="mixSortStart">START</button>`;
  }else{
    html+=`<div class="standby-hint">出題モードをえらんでください</div>`;
  }
  html+=`</div>`;
  $("#main").innerHTML=html;

  if(selected==="mixrandom"){
    const max = ERAS.reduce((s,e)=>s+e.cards.length,0);
    const quick=[...new Set([10,20,30,50].filter(v=>v<=max).concat([max]))];
    const qbox=$("#mixQuick");
    quick.forEach(v=>{
      const b=document.createElement("button");
      b.className="mix-chip";
      b.textContent = v===max ? `全${v}` : `${v}`;
      b.onclick=()=>{ $("#mixNum").value=v; };
      qbox.appendChild(b);
    });
    $("#mixStart").onclick=()=>runMix();
    $("#mixNum").addEventListener("keydown", e=>{ if(e.key==="Enter") runMix(); });
  }
  if(selected==="mixsort"){
    $("#mixSortStart").onclick=()=>startMixSort();
  }
}

function runMix(){
  const all = [];
  ERAS.forEach(e=> e.cards.forEach(c=> all.push({...c, era:e.era})));
  const max = all.length;
  let num = parseInt($("#mixNum").value, 10);
  if(isNaN(num) || num<1) num = 1;
  if(num>max) num = max;
  state.mode="mix";
  state.queue = shuffle(all).slice(0, num);
  begin(`全時代MIX ${num}問`);
}

/* ========== 間違えた問題の解き直し（統一フロー） ==========
   箱には用語カード（type未設定）と並び替え（type:"sort"）が混在する。
   1本のキューにして、要素ごとに種別を見てUIを出し分ける。
   正解したものだけ箱から取り除く。 */
let reviewState = null;
function startReview(){
  state.playing=true;
  state.mode="review";
  const cur=ERAS[state.eraIndex];
  reviewState = {
    era: cur.era,
    queue: shuffle(curMissed().map(m=>({...m}))),
    pos: 0,
    correct: 0
  };
  state.queue = reviewState.queue;   // 進捗表示の分母などで参照される
  $("#modeLabel").textContent = `間違えた問題の解き直し｜${cur.era}`;
  renderEras(); renderModes();
  renderReviewItem();
}

// キューの現在位置の1問を、種別に応じて表示する
function renderReviewItem(){
  const total = reviewState.queue.length;
  if(reviewState.pos >= total){ finishReview(); return; }
  $("#progress").textContent = `${reviewState.pos+1} / ${total}`;
  $("#barFill").style.width = (reviewState.pos/total*100)+"%";
  const item = reviewState.queue[reviewState.pos];
  if(item.type==="sort"){ renderReviewSort(item); }
  else { renderReviewCard(item); }
}

// 解き直し中に、正解した1問を箱から取り除く
// 未登録なら、その問題を時代ごとの間違い箱に入れる（おすすめ等で新規に間違えたときに使う）
function addToMissed(card){
  const era = card.era;
  if(!era) return;
  if(!state.missedByEra[era]) state.missedByEra[era]=[];
  const box=state.missedByEra[era];
  if(!box.some(m=>m.type!=="sort" && m.q===card.q && m.a===card.a)){
    box.push({q:card.q, a:card.a, era:era, group:card.group, note:card.note});
    saveMissed(); renderModes();
  }
}
function removeFromMissed(item){
  const era = item._box || item.era || reviewState.era;   // その問題が入っている箱から消す（多時代対応）
  const box = state.missedByEra[era];
  if(!box) return;
  if(item.type==="sort"){
    state.missedByEra[era] = box.filter(m=>!(m.type==="sort" && m.theme===item.theme && m.era===item.era));
  }else{
    state.missedByEra[era] = box.filter(m=>!(m.type!=="sort" && m.q===item.q && m.a===item.a));
  }
  saveMissed();
  renderModes();
}

// 次の問題へ進む（正誤に関わらず呼ぶ）
function reviewNext(){
  reviewState.pos++;
  renderReviewItem();
}

// --- 用語カードの解き直し ---
function renderReviewCard(card){
  const html=`
    <div class="stage">
      <div class="card" id="reviewCard">
        <div class="face front">
          <div class="eyebrow">${card.era||""}${card.group?" · "+card.group:""}</div>
          <div class="body"><div class="q-text">${card.q}</div></div>
          <div class="hint-flip">タップで答えを見る</div>
        </div>
        <div class="face back">
          <div class="eyebrow">こたえ</div>
          <div class="body"><div class="a-text">${card.a}</div></div>
          ${card.note?`<div class="note">${card.note}</div>`:""}
        </div>
      </div>
    </div>
    <div class="judge">
      <button class="miss" id="rvMiss">まだ覚えてない</button>
      <button class="ok" id="rvOk">覚えた</button>
    </div>`;
  $("#main").innerHTML=html;
  let flipped=false;
  const c=$("#reviewCard");
  c.onclick=()=>{ flipped=!flipped; c.classList.toggle("flip",flipped); };
  $("#rvMiss").onclick=()=>{ logStudyActivity(); recordAnswer(card.era, false); addToMissed(card); reviewNext(); };                 // まだ→箱に残す（新しい問題なら追加）
  $("#rvOk").onclick=()=>{ logStudyActivity(); recordAnswer(card.era, true); reviewState.correct++; removeFromMissed(card); reviewNext(); };  // 覚えた→箱から消す
}

// --- 並び替えの解き直し（通常の並び替えと同じUI） ---
function renderReviewSort(item){
  const shuffled = shuffle(item.items.map((it,idx)=>({...it, origIndex:idx})));
  const rs = { item, shuffled, picked:[] };

  const html=`<div class="sort-wrap">
    <div class="sort-head">
      <div class="sort-era">${item.isMix ? "全時代" : item.era} · ${item.theme}</div>
      <div class="sort-inst">古いものから順にタップしてください</div>
    </div>
    <div class="sort-slots" id="rvSortSlots"></div>
    <div class="sort-choices" id="rvSortChoices"></div>
    <button class="sort-reset" id="rvSortReset">やり直す</button>
  </div>`;
  $("#main").innerHTML=html;

  function drawSlots(){
    const box=$("#rvSortSlots"); box.innerHTML="";
    const total=rs.shuffled.length;
    for(let i=0;i<total;i++){
      const picked=rs.picked[i];
      const slot=document.createElement("div");
      slot.className="sort-slot"+(picked!==undefined?" filled":"");
      if(picked!==undefined){
        const it=rs.shuffled[picked];
        slot.innerHTML=`<span class="sort-num">${i+1}</span><span class="sort-slot-label">${it.label}</span>`;
        slot.onclick=()=>{ rs.picked.splice(i,1); drawSlots(); drawChoices(); };
      }else{
        slot.innerHTML=`<span class="sort-num">${i+1}</span><span class="sort-slot-empty">？</span>`;
      }
      box.appendChild(slot);
    }
  }
  function drawChoices(){
    const box=$("#rvSortChoices"); box.innerHTML="";
    rs.shuffled.forEach((it,idx)=>{
      if(rs.picked.includes(idx)) return;
      const b=document.createElement("button");
      b.className="sort-choice";
      b.textContent=it.label;
      b.onclick=()=>{
        rs.picked.push(idx);
        drawSlots(); drawChoices();
        if(rs.picked.length===rs.shuffled.length){ setTimeout(()=>judgeReviewSort(rs), 300); }
      };
      box.appendChild(b);
    });
  }
  $("#rvSortReset").onclick=()=>{ rs.picked=[]; drawSlots(); drawChoices(); };
  drawSlots(); drawChoices();
}

function judgeReviewSort(rs){
  logStudyActivity();
  const userOrder = rs.picked.map(i=>rs.shuffled[i].origIndex);
  const correct = userOrder.every((v,idx)=>v===idx);
  recordAnswer(rs.item.isMix ? "全時代MIX" : rs.item.era, correct);   // 習熟度・コンボの記録
  if(correct){ reviewState.correct++; removeFromMissed(rs.item); }
  // 正しい順番を見せる
  const rows = rs.item.items.map((it,i)=>
    `<div class="sort-ans-row"><span class="sort-num">${i+1}</span><span>${it.label}</span><span class="sort-ans-note">${it.note}</span></div>`
  ).join("");
  $("#main").innerHTML=`
    <div class="sort-result">
      <div class="sort-verdict ${correct?'ok':'ng'}">${correct?"正解！":"おしい！"}</div>
      <div class="sort-ans-title">正しい順番</div>
      <div class="sort-ans-list">${rows}</div>
      <button class="sort-next" id="rvSortNext">次へ</button>
    </div>`;
  $("#rvSortNext").onclick=()=>{ reviewNext(); };
}

// 全時代の間違い箱に残っている問題数の合計
function totalMissed(){
  let n=0; for(const k in state.missedByEra){ n += (state.missedByEra[k]||[]).length; } return n;
}

/* ============================================================
   今日のおすすめ：間違い箱を最優先＋苦手な時代の新しい用語カードで補充。
   既存の「解き直し」エンジン（reviewState / renderReviewItem）を多時代で流用する。
   ============================================================ */
const REC_TARGET = 15, REC_MISSED_CAP = 10;
function buildRecommend(){
  const set=[];
  // 1) 間違い箱（全時代横断。どの箱由来かを _box に記録して、正解時に正しく取り除けるようにする）
  let missed=[];
  for(const k in state.missedByEra){
    (state.missedByEra[k]||[]).forEach(m=> missed.push({...m, _box:k}));
  }
  missed = shuffle(missed).slice(0, REC_MISSED_CAP);
  set.push(...missed);
  const missedCount = missed.length;
  // 2) 残りを「苦手な時代」の新しい用語カードで補充
  const usedEras=[];
  let need = REC_TARGET - set.length;
  if(need>0){
    const ranked = ERAS.map(e=>{
      const s=state.stats.eras[e.era]||{correct:0,total:0};
      const pct = s.total ? s.correct/s.total : null;   // 未着手は null
      return {e, pct};
    }).filter(r=> r.e.cards && r.e.cards.length)
      .sort((a,b)=>{
        const pa = a.pct===null ? 0.65 : a.pct;   // 未着手は中間の優先度
        const pb = b.pct===null ? 0.65 : b.pct;
        return pa-pb;                              // 正答率の低い時代を優先
      });
    const inSet = new Set(set.filter(x=>x.type!=="sort").map(x=> x.era+"|"+x.q));
    // 苦手 上位（最大4時代）から、順ぐりに少しずつ集める＝1時代に偏らせない
    const focus = ranked.slice(0, Math.min(4, ranked.length));
    const pools = focus.map(r=>({ era:r.e.era, cards: shuffle(r.e.cards.filter(c=> !inSet.has(r.e.era+"|"+c.q))) }));
    let safety=0;
    while(need>0 && safety<2000){
      safety++;
      let progressed=false;
      for(const pool of pools){
        if(need<=0) break;
        const c = pool.cards.shift();
        if(c){
          set.push({...c, era:pool.era});
          if(!usedEras.includes(pool.era)) usedEras.push(pool.era);
          need--; progressed=true;
        }
      }
      if(!progressed) break;   // 全プールが尽きた
    }
  }
  const freshCount = set.length - missedCount;
  let reason;
  if(missedCount && freshCount) reason = `間違えた問題 ${missedCount}問 ＋ 苦手な「${usedEras.slice(0,2).join("・")}」から ${freshCount}問`;
  else if(missedCount)          reason = `間違えた問題 ${missedCount}問`;
  else if(freshCount)           reason = `苦手な「${usedEras.slice(0,2).join("・")}」を中心に ${freshCount}問`;
  else                          reason = "まだ出題できる問題がありません";
  return { set: shuffle(set), reason };
}

function startRecommend(){
  const { set, reason } = buildRecommend();
  if(!set.length){ backToStandby(); return; }
  state.playing=true;
  state.mode="review";
  state.eraIndex=null;   // 多時代
  reviewState = { era:"今日のおすすめ", recommend:true, queue:set, pos:0, correct:0 };
  state.queue = set;
  $("#modeLabel").textContent="今日のおすすめ";
  $("#progress").textContent="—";
  $("#barFill").style.width="0%";
  renderEras(); renderModes();

  $("#main").innerHTML=`

}
