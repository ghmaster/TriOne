// HTMLエスケープ（用語に < > & が無くても安全側で）
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, ch=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch]));
}
// キーワード部分を強調表示（大文字小文字は区別しない）
function highlight(text, kw){
  const safe=escapeHtml(text);
  if(!kw) return safe;
  const safeKw=escapeHtml(kw);
  // 正規表現の特殊文字をエスケープ
  const pat=safeKw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{
    return safe.replace(new RegExp(pat, "gi"), m=>`<span class="list-hit">${m}</span>`);
  }catch(e){ return safe; }
}

// 検索キーワードで絞り込んで結果だけ再描画する
function renderListResults(keyword){
  const cur=ERAS[state.eraIndex];
  const kw=(keyword||"").trim();
  const kwLower=kw.toLowerCase();
  const matched = cur.cards.filter(c=>{
    if(!kw) return true;
    return (c.q+" "+c.a).toLowerCase().includes(kwLower);
  });

  const box=$("#listResults");
  if(!box) return;

  if(matched.length===0){
    box.innerHTML=`<div class="list-empty">「${escapeHtml(kw)}」を含む問題は見つかりませんでした</div>`;
    $("#progress").textContent="0問";
    return;
  }

  // グループごとにまとめる（データの並び順を保つ）
  const groups=[]; const map={};
  matched.forEach(c=>{
    const g=c.group||"その他";
    if(!map[g]){ map[g]={name:g,items:[]}; groups.push(map[g]); }
    map[g].items.push(c);
  });

  let html="";
  groups.forEach(g=>{
    html+=`<div class="list-group"><div class="list-group-head">${escapeHtml(g.name)}</div>`;
    g.items.forEach(c=>{
      html+=`<div class="list-item"><div class="list-q">${highlight(c.q,kw)}</div><div class="list-a">${highlight(c.a,kw)}</div></div>`;
    });
    html+="</div>";
  });
  const label = kw ? `該当 ${matched.length} 問 / 全 ${cur.cards.length} 問` : `全 ${cur.cards.length} 問`;
  html+=`<div class="list-count">${label}</div>`;
  box.innerHTML=html;
  $("#progress").textContent=`${matched.length}問`;
}

function begin(label){
  state.playing=true;
  state.pos=0;state.correct=0;state.flipped=false;
  $("#modeLabel").textContent=label;

}

function renderCard(){
  const total=state.queue.length;
  const c=state.queue[state.pos];
  $("#progress").textContent=`${state.pos+1} / ${total}`;
  $("#barFill").style.width=((state.pos)/total*100)+"%";
  $("#main").innerHTML=`
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow">${c.era||""}${c.group?" · "+c.group:""}</div>
          <div class="body"><div class="q-text">${c.q}</div></div>
          <div class="hint-flip">タップで答えを見る</div>
        </div>
        <div class="face back">
          <div class="eyebrow">こたえ</div>
          <div class="body"><div class="a-text">${c.a}</div></div>
          ${c.note?`<div class="note">${c.note}</div>`:""}
        </div>
      </div>
    </div>
    <div class="judge">
      <button class="miss" id="btnMiss">まだ覚えてない</button>
      <button class="ok" id="btnOk">覚えた</button>
    </div>`;
  state.flipped=false;
  const card=$("#card");
  card.onclick=()=>{
    state.flipped=!state.flipped;
    card.classList.toggle("flip",state.flipped);
  };
  $("#btnMiss").onclick=()=>judge(false,c);
  $("#btnOk").onclick=()=>judge(true,c);
}

function judge(ok,card){
  logStudyActivity();
  // このカードが属する時代の「間違い箱」を取得
  const era = card.era || ERAS[state.eraIndex].era;
  recordAnswer(era, ok);   // 習熟度・コンボの記録（「覚えた」＝正解）
  if(!state.missedByEra[era]) state.missedByEra[era] = [];
  const box = state.missedByEra[era];
  if(ok){
    state.correct++;
    // 解き直しで正解できたら、その時代の箱から取り除く
    if(state.mode==="review"){
      state.missedByEra[era] = box.filter(m=>!(m.a===card.a && m.q===card.q));
    }
  }else{
    // 間違えた問題を、その時代の箱に記録（同じ問題は重複させない）
    if(!box.some(m=>m.a===card.a && m.q===card.q)){
      box.push({...card});
    }
  }
  saveMissed();
  // 「間違えた問題」ボタンのカウント表示をその場で更新する
  renderModes();
  state.pos++;
  if(state.pos>=state.queue.length) finish(); else renderCard();
}

function finish(){
  $("#barFill").style.width="100%";
  $("#progress").textContent="完了";
  const total=state.queue.length;
  const pct=Math.round(state.correct/total*100);

  if(state.mode==="mix"){
    // 全時代MIX完了：間違いは各時代に振り分け済み。合計を表示する。
    const totalMiss = ERAS.reduce((s,e)=>{
      const box = state.missedByEra[e.era];
      return s + (box? box.length : 0);
    }, 0);
    $("#main").innerHTML=`
      <div class="done">
        <h2>おつかれさま！</h2>
        <div class="score">${state.correct} / ${total}</div>
        <p>正解率 ${pct}%${totalMiss?` ・ 間違えた問題は各時代にたまっています（合計 ${totalMiss}問）`:" ・ 全問正解！"}</p>
        <div>
          <button onclick="startMix()">もう一度ミックス</button>
          <button class="secondary" onclick="backToStandby()">モードを選び直す</button>
        </div>
      </div>`;
    renderEras(); renderModes();
    return;
  }

  const cur=ERAS[state.eraIndex];
  const missNow=curMissed().length;
  $("#main").innerHTML=`
    <div class="done">
      <h2>おつかれさま！</h2>
      <div class="score">${state.correct} / ${total}</div>
      <p>正解率 ${pct}%${missNow?` ・ ${cur.era}の解き直し待ち ${missNow}問`:" ・ この時代はクリア！"}</p>
      <div>
        ${missNow?`<button onclick="startReview()">間違えた問題を解き直す</button>`:""}
        <button onclick="start('random')">もう一度ランダム10問</button>
        <button class="secondary" onclick="backToStandby()">モードを選び直す</button>
      </div>
    </div>`;
  renderModes();
}

/* ============================================================
   SOPHIA（AI相談チャット）
   今はUIのみ。getSophiaResponse() が実際の応答を作る場所で、
   ここを本物のAPI呼び出し（Cloudflare Worker等）に差し替えれば
   そのまま本番のAI相談機能になる。
   ============================================================ */
let sophiaHistory = [];       // {role:"user"|"ai", text} の配列（このセッション中のみ保持）
let sophiaStarted = false;

function initSophia(){
  if(!sophiaStarted){
    sophiaStarted = true;
    sophiaHistory.push({role:"ai", text:"こんにちは、SOPHIAだよ。社会科でわからないことがあったら、なんでも聞いてね。"});
  }
  renderSophiaMessages();
  const input = document.getElementById("sophiaInput");
  if(input) setTimeout(()=>input.focus(), 300);
}

function renderSophiaMessages(){
  const box = document.getElementById("sophiaMessages");
  if(!box) return;
  box.innerHTML = sophiaHistory.map(m=>{
    if(m.role==="ai"){
      return `<div class="sophia-msg ai"><span class="who">SOPHIA</span>${escapeHtml(m.text)}</div>`;
    }
    return `<div class="sophia-msg user">${escapeHtml(m.text)}</div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

// ここが実際の応答を作る場所（今はダミー）。
// 将来ここをCloudflare Worker等への fetch に差し替えれば、そのまま本物のAI相談になる。
function getSophiaResponse(userText, history){
  return new Promise(resolve=>{
    setTimeout(()=>{
      resolve("ごめんね、SOPHIAはまだAIとつながっていないんだ。もうすこし待っててね。（この返信はダミーです）");
    }, 700 + Math.random()*500);
  });
}

function sendSophiaMessage(){
  const input = document.getElementById("sophiaInput");
  const sendBtn = document.getElementById("sophiaSend");
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;

  sophiaHistory.push({role:"user", text});
  input.value = "";
  input.style.height = "auto";
  renderSophiaMessages();

  // 「入力中…」を出す
  const box = document.getElementById("sophiaMessages");
  const typing = document.createElement("div");
  typing.className = "sophia-typing";
  typing.id = "sophiaTyping";
  typing.textContent = "SOPHIAが考えています…";
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  if(sendBtn) sendBtn.disabled = true;

  getSophiaResponse(text, sophiaHistory).then(reply=>{
    const t = document.getElementById("sophiaTyping");
    if(t) t.remove();
    sophiaHistory.push({role:"ai", text:reply});
    renderSophiaMessages();
    if(sendBtn) sendBtn.disabled = false;
  });
}

(function(){
  const input = document.getElementById("sophiaInput");
  const sendBtn = document.getElementById("sophiaSend");
  if(!input || !sendBtn) return;
  sendBtn.addEventListener("click", sendSophiaMessage);
  // Enterで送信、Shift+Enterで改行
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){
      e.preventDefault();
      sendSophiaMessage();
    }
  });
  // テキストエリアの高さを内容に合わせて自動調整
  input.addEventListener("input", ()=>{
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
})();

// 最初はホーム画面を表示
showHome();

/* ============================================================
   全画面共通の背景：重なり合うsin波のアニメーション
   スプラッシュの裏側から動き始め、トップ画面・HISTORIA画面でも
   途切れず流れ続ける（桜に代わる新しい背景演出）。
   波の上を、イルカ風の影・小魚の群れ・泡が泳いでいく。
   ============================================================ */
(function(){
  const canvas = document.getElementById("bgWaveCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  let width, height;

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function rand(a,b){ return a + Math.random()*(b-a); }

  // 複数の波を重ねて奥行きを出す（色はそれぞれ透過つきで重色になる）
  const waves = [
    { amplitude:50, frequency:0.008, speed:0.02,  color:"rgba(99,102,241,0.25)",  offsetY:0   },  // インディゴ
    { amplitude:70, frequency:0.005, speed:0.015, color:"rgba(168,85,247,0.2)",   offsetY:-20 },  // パープル
    { amplitude:40, frequency:0.012, speed:0.025, color:"rgba(56,189,248,0.25)",  offsetY:30  },  // シアン
    { amplitude:90, frequency:0.004, speed:0.01,  color:"rgba(236,72,153,0.15)",  offsetY:-10 },  // ピンク
    { amplitude:60, frequency:0.009, speed:0.018, color:"rgba(45,212,191,0.2)",   offsetY:15  }   // エメラルド
  ];

  // 波が届く一番高い位置（＝海面の上端）を波のパラメータから計算しておく。
  // これより上（画面の暗い部分＝海じゃないところ）には泡を出さない。
  const waveTopOffset = Math.min(...waves.map(w => w.offsetY - w.amplitude*1.2));
  const SURFACE_MARGIN = 24;   // 海面ぎりぎりに張り付かないよう少し余裕を持たせる
  const waterTopAt = h => h/2 + waveTopOffset + SURFACE_MARGIN;   // その高さでの海面ライン

  // --- 泡（海の中だけをゆっくり上へのぼる） ---
  const bubbles = [];
  for(let i=0;i<14;i++){
    bubbles.push({
      x: rand(0,width), y: rand(waterTopAt(height)+10, height), r: rand(2,6),
      speed: rand(0.15,0.4), phase: rand(0,Math.PI*2)
    });
  }

  // 泡（輪郭だけの円）
  function drawBubble(x,y,r,alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  let step = 0;
  function animate(){
    ctx.clearRect(0,0,width,height);
    step += 0.05;

    // 波
    waves.forEach(wave=>{
      ctx.beginPath();
      ctx.fillStyle = wave.color;
      const baseCenterY = height/2 + wave.offsetY;
      ctx.moveTo(0, height);
      for(let x=0; x<=width; x+=5){
        const y = baseCenterY
          + Math.sin(x*wave.frequency + step*wave.speed) * wave.amplitude
          + Math.cos((x*0.5 + step*10) * wave.frequency) * (wave.amplitude*0.2);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      ctx.fill();
    });

    // 海面（これより上には泡を描かない）
    const waterTop = height/2 + waveTopOffset + SURFACE_MARGIN;

    // 泡（海の中だけを漂う。海面に着いたら底からやり直す）
    bubbles.forEach(b=>{
      b.y -= b.speed;
      if(b.y < waterTop){ b.y = height+10; b.x = rand(0,width); }
      const bx = b.x + Math.sin(step*0.3 + b.phase)*6;
      drawBubble(bx, b.y, b.r, 0.35);
    });

    requestAnimationFrame(animate);
  }
  animate();
})();

/* 起動スプラッシュの制御：
   数秒表示 → フェードアウト。表示中にクリック／キー押下で即フェードアウト。 */
(function(){
  const splash = document.getElementById("splash");
  if(!splash) return;
  let dismissed = false;
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    splash.classList.add("out");
    // フェードアウト（.6s）が終わったらDOMから消す（波の背景は消えずそのまま流れ続ける）
    setTimeout(()=>{ splash.remove(); }, 650);
    window.removeEventListener("click", dismiss);
    window.removeEventListener("keydown", dismiss);
    window.removeEventListener("touchstart", dismiss);

    // トップ画面を順次フェードインさせる
    // （intro は最初からHTMLに付いていて一時停止状態。ここで play を付けて再生開始する）
    function revealHome(){
      const home = document.getElementById("homeScreen");
      if(home){
        home.classList.add("play");
        // 全フェーズ（最大 delay2.3s + duration0.9s ≒ 3.2s）終了後に intro/play を外す
        setTimeout(()=>{ home.classList.remove("intro","play"); }, 3400);
      }
      // 設定ボタンも、見出しが出そろうころに遅れてフェードイン
      const sbtn = document.getElementById("settingsBtn");
      if(sbtn){
        sbtn.classList.add("play");
        setTimeout(()=>{ sbtn.classList.remove("intro","play"); }, 3600);
      }
      // 右上バッジ（連続ログイン・学習時間）も、ホームと同じタイミングでフェードイン
      ["studyCalBtn","studyTimeBtn"].forEach(id=>{
        const el = document.getElementById(id);
        if(el){ el.classList.add("play"); setTimeout(()=>{ el.classList.remove("intro","play"); }, 3600); }
      });
    }

    // 今日はじめての記録なら、トップ画面より先に連続学習日数のアニメーションを見せる
    if(typeof streakAnimData!=="undefined" && streakAnimData.show && typeof showStreakAnim==="function"){
      showStreakAnim(streakAnimData.from, streakAnimData.to, revealHome);
    }else{
      revealHome();
    }
  }
  // 4秒後に自動フェードアウト
  const timer = setTimeout(dismiss, 4000);
  // 表示中の操作で即フェードアウト
  window.addEventListener("click", dismiss);
  window.addEventListener("keydown", dismiss);
  window.addEventListener("touchstart", dismiss, {passive:true});
})();

/* #main の中身が差し替わるたびに、子要素のフェードインを付け直す。
   （同じ要素が使い回されてもアニメが再生されるようにする） */
(function(){
  const main = document.getElementById("main");
  if(!main) return;
  const applyFade = ()=>{
    for(const child of main.children){
      child.style.animation="none";
      // 強制リフロー：これでアニメがリセットされ、次の行で再生される
      void child.offsetWidth;
      child.style.animation="fadeInUp .32s ease-out";
    }
  };
  const observer = new MutationObserver(applyFade);
  observer.observe(main, { childList:true });
})();

/* ============================================================
   環境音をコードで生成（木漏れ日＝そよ風＋鳥 / せせらぎ＝流水）。
   ブラウザの自動再生制限のため、最初のユーザー操作後に開始できる。
   種類はいつでも切り替え可能。
   ============================================================ */
let ambientAudio = (function(){
  let actx = null, master = null, running = false, birdTimer = null;
  let layer = null;          // 現在鳴っている音のノード群（切り替え時に停止する）
  let curType = "komorebi";

  function ensureContext(){
    if(actx) return true;
    try{
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0;           // 無音から始めてフェードインする
      master.connect(actx.destination);
      return true;
    }catch(e){ return false; }
  }

  function makeNoiseSource(seconds){
    const bufferSize = (seconds||2) * actx.sampleRate;
    const buf = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }

  // 現在のレイヤーを止めて片付ける
  function teardownLayer(){
    if(!layer) return;
    clearTimeout(birdTimer);
    (layer.nodes||[]).forEach(n=>{ try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect && n.disconnect(); }catch(e){} });
    layer = null;
  }

  // 木漏れ日：そよ風（丸いノイズ）＋鳥のさえずり
  function buildKomorebi(){
    const nodes = [];
    const noise = makeNoiseSource(2);
    const lp = actx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=550; lp.Q.value=0.7;
    const g = actx.createGain(); g.gain.value=0.12;
    const lfo = actx.createOscillator(); lfo.frequency.value=0.09;
    const lfoGain = actx.createGain(); lfoGain.gain.value=0.06;
    lfo.connect(lfoGain).connect(g.gain);
    noise.connect(lp).connect(g).connect(master);
    noise.start(); lfo.start();
    nodes.push(noise, lfo);
    // 鳥のさえずり
    function chirp(){
      if(!actx || !running || curType!=="komorebi") return;
      const now = actx.currentTime;
      const notes = 2 + Math.floor(Math.random()*3);
      let t = now;
      for(let i=0;i<notes;i++){
        const osc = actx.createOscillator();
        const og = actx.createGain();
        osc.type="sine";
        const base = 1800 + Math.random()*1600;
        osc.frequency.setValueAtTime(base, t);
        osc.frequency.exponentialRampToValueAtTime(base*(1.15+Math.random()*0.5), t+0.05);
        osc.frequency.exponentialRampToValueAtTime(base*0.9, t+0.12);
        const vol = 0.05 + Math.random()*0.05;
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(vol, t+0.01);
        og.gain.exponentialRampToValueAtTime(0.0001, t+0.13);
        osc.connect(og).connect(master);
        osc.start(t); osc.stop(t+0.15);
        t += 0.09 + Math.random()*0.06;
      }
      birdTimer = setTimeout(chirp, 2000 + Math.random()*7000);
    }
    birdTimer = setTimeout(chirp, 1500 + Math.random()*2000);
    return { nodes };
  }

  // せせらぎ：小川がチョロチョロ流れる感じ（控えめな水の土台＋不規則な水滴の粒）
  function buildSeseragi(){
    const nodes = [];
    // 土台：ごく控えめな水の流れ（うるさくしない）
    const bed = makeNoiseSource(2);
    const bedBP = actx.createBiquadFilter();
    bedBP.type="bandpass"; bedBP.frequency.value=900; bedBP.Q.value=0.7;
    const bedG = actx.createGain(); bedG.gain.value=0.05;   // 小さめ
    bed.connect(bedBP).connect(bedG).connect(master);
    bed.start(); nodes.push(bed);

    // 水滴・泡：短い帯域ノイズを不規則に鳴らして「チョロチョロ／ポコポコ」感を出す
    let dropTimer = null;
    function drop(){
      if(!actx || !running || (layer && layer.type!=="seseragi")) return;
      const now = actx.currentTime;
      // 1〜3粒まとめて
      const n = 1 + Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const t = now + i*(0.03 + Math.random()*0.06);
        const src = makeNoiseSource(0.3);
        const bp = actx.createBiquadFilter();
        bp.type="bandpass";
        const f = 900 + Math.random()*2200;      // 粒ごとに高さがちがう
        bp.frequency.setValueAtTime(f, t);
        bp.frequency.exponentialRampToValueAtTime(f*1.5, t+0.06);  // 上がって「チョロッ」
        bp.Q.value = 6 + Math.random()*8;
        const g = actx.createGain();
        const vol = 0.05 + Math.random()*0.07;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.10+Math.random()*0.08);
        src.connect(bp).connect(g).connect(master);
        src.start(t); src.stop(t+0.25);
      }
      // 次の粒まで不規則な短い間隔（チョロチョロ絶え間なく）
      dropTimer = setTimeout(drop, 120 + Math.random()*380);
    }
    dropTimer = setTimeout(drop, 200);
    // teardown用に、タイマーを止められるダミーノードを入れておく
    nodes.push({ stop(){ clearTimeout(dropTimer); }, disconnect(){} });
    return { nodes };
  }

  // 潮騒：波が寄せては返す（ゆっくり周期的に盛り上がって引く、崩れる瞬間はノイズが明るくなる）
  function buildShiosai(){
    const nodes = [];
    // 波の土台（ゴーッという広帯域の量感。低域に寄せすぎない＝風にしない）
    const bed = makeNoiseSource(2);
    const bedBP = actx.createBiquadFilter();
    bedBP.type="bandpass"; bedBP.frequency.value=1000; bedBP.Q.value=0.35;
    const bedHP = actx.createBiquadFilter();
    bedHP.type="highpass"; bedHP.frequency.value=250;   // こもった低音だけにならないようにする
    const bedG = actx.createGain(); bedG.gain.value=0.001;
    bed.connect(bedBP).connect(bedHP).connect(bedG).connect(master);
    bed.start();
    nodes.push(bed);

    // 泡のシュワシュワ（崩れたあと、高域ノイズがゆっくり自然にゆらぎながら消えていく）
    const fizz = makeNoiseSource(2);
    const fizzHP = actx.createBiquadFilter();
    fizzHP.type="highpass"; fizzHP.frequency.value=2200;
    const fizzLP = actx.createBiquadFilter();
    fizzLP.type="lowpass"; fizzLP.frequency.value=7000;   // 上限も絞って耳に痛くしない
    // 全体の勢い（クラッシュのたびに立ち上がり、指数的にじわじわ減衰）＝一定間隔の更新はしない
    const fizzEnv = actx.createGain(); fizzEnv.gain.value = 0.0001;
    // その上に、非整数比のゆっくりしたLFOを何本か重ねて「規則的でない」自然なゆらぎを作る
    const fizzMod = actx.createGain(); fizzMod.gain.value = 0.045;
    [3.7, 5.3, 8.1].forEach((freq, i)=>{
      const lfo = actx.createOscillator(); lfo.frequency.value = freq;
      const lg = actx.createGain(); lg.gain.value = 0.30 + i*0.05;
      lfo.connect(lg).connect(fizzMod.gain);
      lfo.start();
      nodes.push(lfo);
    });
    fizz.connect(fizzHP).connect(fizzLP).connect(fizzMod).connect(fizzEnv).connect(master);
    fizz.start();
    nodes.push(fizz);

    // 砕ける瞬間：広帯域のノイズが一気に立ち上がる「ザッパーン」
    function crash(peakVol){
      const now = actx.currentTime;
      const src = makeNoiseSource(1.0);
      const hp = actx.createBiquadFilter();
      hp.type="highpass"; hp.frequency.value=350;      // 広帯域（狭いバンドパスにしない）
      const lp = actx.createBiquadFilter();
      lp.type="lowpass"; lp.frequency.value=6500;
      const g = actx.createGain();
      const vol = peakVol*1.5;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(vol, now+0.09);     // 一気に砕ける（速い立ち上がり）
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.7);   // すっと引く
      src.connect(hp).connect(lp).connect(g).connect(master);
      src.start(now); src.stop(now+1.2);
      nodes.push(src);
      // 泡のシュワシュワを、なめらかな山（すっと立ち上がりゆっくり消える）で鳴らす
      fizzEnv.gain.cancelScheduledValues(now);
      fizzEnv.gain.setValueAtTime(Math.max(fizzEnv.gain.value,0.0001), now);
      fizzEnv.gain.exponentialRampToValueAtTime(0.9, now+0.18);
      fizzEnv.gain.exponentialRampToValueAtTime(0.0001, now+2.6+Math.random()*1.2);
    }

    // 1つの波：じわっと盛り上がり、ピークで砕けて（クラッシュ＋泡）、ゆっくり引いていく
    let waveTimer = null;
    function wave(){
      if(!actx || !running || (layer && layer.type!=="shiosai")) return;
      const now = actx.currentTime;
      const rise = 2.0 + Math.random()*1.6;      // 寄せる時間
      const fall = 3.2 + Math.random()*2.4;      // 引く時間
      const peakVol = 0.11 + Math.random()*0.06;

      bedG.gain.cancelScheduledValues(now);
      bedG.gain.setValueAtTime(Math.max(bedG.gain.value,0.001), now);
      bedG.gain.exponentialRampToValueAtTime(peakVol, now+rise);
      bedG.gain.exponentialRampToValueAtTime(0.015, now+rise+fall);

      // ピークのタイミングで「砕ける」
      setTimeout(()=>{ if(running && layer && layer.type==="shiosai") crash(peakVol); }, rise*1000);

      // 次の波まで：一定のリズム感は保ちつつ、毎回かなり不規則にする（たまに間が空く「凪」も）
      const base = (rise+fall)*1000;
      const jitter = (Math.random()-0.5)*2 * base*0.35;     // ±35%程度ばらつかせる
      const lull = Math.random()<0.15 ? base*(0.4 + Math.random()*0.5) : 0;  // まれに長い間隔（凪）
      waveTimer = setTimeout(wave, Math.max(1800, base*0.55 + jitter + lull));
    }
    waveTimer = setTimeout(wave, 300);
    nodes.push({ stop(){ clearTimeout(waveTimer); }, disconnect(){} });
    return { nodes };
  }

  function buildLayer(type){
    if(type==="seseragi") return buildSeseragi();
    if(type==="shiosai") return buildShiosai();
    return buildKomorebi();
  }

  // 指定した種類で開始（またはフェードイン）。ユーザー操作後に呼ぶ。
  function start(type, fadeSec){
    if(type) curType = type;
    if(!ensureContext()) return;
    if(actx.state === "suspended") actx.resume();
    // すでに鳴っていて種類が同じなら何もしない
    if(running && layer && layer.type===curType) return;
    teardownLayer();
    running = true;
    layer = buildLayer(curType);
    layer.type = curType;
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0.9, now + (fadeSec||3));
  }
  // 種類を切り替える（鳴っていなければ何もしない）
  function setType(type, fadeSec){
    curType = type;
    if(!running) return;
    teardownLayer();
    layer = buildLayer(curType);
    layer.type = curType;
  }
  function stop(fadeSec){
    if(!actx || !running) return;
    running = false;
    teardownLayer();
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + (fadeSec||1));
  }
  return { start, setType, stop, get running(){ return running; } };
})();
