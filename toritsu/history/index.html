<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HISTORIA</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel-2:#232732; --line:#2c313c;
    --ink:#e8eaed; --sub:#9aa2ad; --accent:#c9a24b; --ok:#4a9d7f; --miss:#c1655a;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(900px 500px at 80% -10%, rgba(201,162,75,.06), transparent 60%),var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;min-height:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 80px}
  header{margin:8px 2px 20px}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:22px;letter-spacing:.06em;font-weight:700}
  .brand .tag{font-size:11px;color:var(--accent);letter-spacing:.16em;border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .lead{color:var(--sub);font-size:13px;margin-top:6px}

  .section-label{font-size:11px;color:var(--sub);letter-spacing:.12em;margin:18px 2px 8px}
  .eras{display:flex;flex-wrap:wrap;gap:8px}
  .era-btn{background:var(--panel);border:1px solid var(--line);color:var(--sub);
    padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s}
  .era-btn:hover{border-color:var(--accent);color:var(--ink)}
  .era-btn.active{background:var(--panel-2);border-color:var(--accent);color:var(--ink)}
  .era-btn .cnt{color:var(--accent);font-size:11px;margin-left:6px}
  .mix-btn{border-style:dashed;border-color:var(--accent)}
  .mix-setup{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 26px;text-align:center}
  .mix-setup h2{font-size:20px;margin-bottom:10px}
  .mix-setup p{color:var(--sub);font-size:13px;margin-bottom:22px;line-height:1.7}
  .mix-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
  .mix-row label{font-size:14px;color:var(--sub)}
  .mix-row input{width:110px;background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    font-size:22px;font-weight:700;text-align:center;padding:10px 12px;border-radius:12px}
  .mix-max{font-size:13px;color:var(--sub)}
  .mix-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
  .mix-chip{background:var(--panel-2);border:1px solid var(--line);color:var(--sub);
    padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
  .mix-chip:hover{border-color:var(--accent);color:var(--ink)}
  .mix-start{background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    padding:13px 30px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer}
  .mix-start:hover{background:rgba(201,162,75,.15)}

  .modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .mode-btn{background:var(--panel);border:1px solid var(--line);color:var(--sub);
    padding:7px 13px;border-radius:10px;font-size:12px;cursor:pointer;transition:.15s}
  .mode-btn:hover{border-color:var(--accent);color:var(--ink)}
  .mode-btn.active{background:var(--panel-2);border-color:var(--accent);color:var(--ink)}
  .review-btn{border-style:dashed}
  .review-btn.has{color:var(--miss)}
  .review-btn .cnt{color:var(--accent);font-size:11px;margin-left:5px}
  .review-btn.has .cnt{color:var(--miss)}

  .status{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px;font-size:12px;color:var(--sub)}
  .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 2px 20px}
  .bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

  .stage{perspective:1400px;margin-bottom:22px}
  .card{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
  .card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:30px 26px;display:flex;flex-direction:column}
  .face .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent)}
  .face .body{flex:1;display:flex;align-items:center}
  .q-text{font-size:21px;font-weight:600;line-height:1.7}
  .a-text{font-size:28px;font-weight:700;color:var(--accent);line-height:1.55}
  .face .note{font-size:13px;color:var(--sub);margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .back{transform:rotateY(180deg)}
  .hint-flip{font-size:12px;color:var(--sub);text-align:center;margin-top:2px}

  .judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .judge button{padding:15px;border-radius:13px;border:1px solid var(--line);
    font-size:15px;font-weight:700;cursor:pointer;background:var(--panel);color:var(--ink);transition:.15s}
  .judge .miss{border-color:rgba(193,101,90,.5)}
  .judge .miss:hover{background:rgba(193,101,90,.15)}
  .judge .ok{border-color:rgba(74,157,127,.5)}
  .judge .ok:hover{background:rgba(74,157,127,.15)}
  .judge button:disabled{opacity:.35;cursor:default}

  .done{text-align:center;padding:40px 20px;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .done h2{font-size:20px;margin-bottom:10px}
  .done p{color:var(--sub);font-size:14px;margin-bottom:20px}
  .done .score{font-size:44px;font-weight:800;color:var(--accent);margin:6px 0}
  .done button{background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);
    padding:12px 26px;border-radius:12px;font-size:14px;cursor:pointer;margin:4px}
  .done button.secondary{border-color:var(--line);color:var(--sub)}

  /* 一覧表示 */
  .list-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .list-group{padding:6px 0}
  .list-group-head{font-size:11px;letter-spacing:.12em;color:var(--accent);padding:12px 20px 6px;border-top:1px solid var(--line)}
  .list-group:first-child .list-group-head{border-top:none}
  .list-item{display:flex;gap:14px;padding:11px 20px;border-top:1px solid rgba(44,49,60,.5)}
  .list-item:first-of-type{border-top:none}
  .list-q{flex:1;font-size:14px;color:var(--ink);line-height:1.6}
  .list-a{flex:0 0 auto;max-width:42%;text-align:right;font-size:14px;font-weight:700;color:var(--accent);line-height:1.6}
  .list-count{font-size:12px;color:var(--sub);padding:14px 20px;border-top:1px solid var(--line)}

  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:28px;line-height:1.8}
  .foot b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>HISTORIA</h1>
    </div>
  </header>

  <div class="section-label">時代をえらぶ</div>
  <div class="eras" id="eras"></div>

  <div class="section-label">出題モード</div>
  <div class="modes" id="modes"></div>

  <div class="status">
    <span id="modeLabel">—</span>
    <span id="progress">—</span>
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div id="main"></div>
</div>

<script>
/* ============================================================
   時代ごとのストック — C案（1用語を複数の切り口で問う）
   ERAS[].cards に各時代のカード。group=事項のまとまり。
   ============================================================ */
const ERAS = [
  {
    era:"古代文明",
    cards:[
      {group:"四大文明",q:"エジプト・メソポタミア・インダス・中国に代表される、大河のほとりで生まれた古代の文明をまとめて何という？",a:"（世界）四大文明",note:"いずれも農耕に適した大河の流域で発生した。"},
      {group:"四大文明",q:"四大文明に共通する、文明が発達した立地上の特徴は？",a:"大河の流域",note:"水と、川がはこぶ肥えた土が農耕を支えた。"},
      {group:"エジプト",q:"ナイル川の流域でおこった、ピラミッドで知られる文明は？",a:"エジプト文明",note:"太陽暦・象形文字を用いた。"},
      {group:"エジプト",q:"エジプト文明が発達した川は？",a:"ナイル川",note:"定期的なはんらんが肥えた土をもたらした。"},
      {group:"エジプト",q:"エジプト文明で使われた、絵をもとにした文字を何という？",a:"象形文字（神聖文字）",note:"ものの形をかたどった文字。"},
      {group:"エジプト",q:"エジプト文明で使われた、太陽の動きをもとにした暦は？",a:"太陽暦",note:"1年を365日とした。今の暦のもと。"},
      {group:"エジプト",q:"エジプトで、王（ファラオ）の力を示すために築かれた巨大な建造物は？",a:"ピラミッド",note:"石を積み上げた王の墓とされる。"},
      {group:"メソポタミア",q:"チグリス川・ユーフラテス川の流域でおこった文明は？",a:"メソポタミア文明",note:"くさび形文字・太陰暦・60進法を生んだ。"},
      {group:"メソポタミア",q:"メソポタミア文明がおこった2つの川は？",a:"チグリス川・ユーフラテス川",note:"2つの川にはさまれた地域で栄えた。"},
      {group:"メソポタミア",q:"メソポタミア文明で、粘土板に刻まれた文字は？",a:"くさび形文字",note:"くさびのような形の記号を組み合わせた。"},
      {group:"メソポタミア",q:"メソポタミア文明で使われた、月の満ち欠けをもとにした暦は？",a:"太陰暦",note:"エジプトの太陽暦と区別して覚える。"},
      {group:"メソポタミア",q:"メソポタミアで生まれ、今も時間や角度に使われている数の表し方は？",a:"60進法",note:"1時間＝60分などに残る。"},
      {group:"メソポタミア",q:"「目には目を、歯には歯を」で知られる、メソポタミアで定められた法典は？",a:"ハンムラビ法典",note:"復讐のかたちで刑罰を定めた。"},
      {group:"インダス",q:"インダス川の流域でおこり、計画的な都市がつくられた文明は？",a:"インダス文明",note:"インダス文字は未解読。"},
      {group:"インダス",q:"インダス文明を代表する、下水道まで整った計画都市の遺跡は？",a:"モヘンジョ・ダロ",note:"れんが造りで整然と区画されていた。"},
      {group:"インダス",q:"インダス文明ののち、アーリア人が持ちこんだきびしい身分制度は？",a:"カースト制度",note:"バラモン（僧）を頂点とする身分の区分。"},
      {group:"インダス",q:"カースト制度で最上位に置かれた、司祭（僧）の身分は？",a:"バラモン",note:"アーリア人が先住民を従えてつくった。"},
      {group:"中国文明",q:"黄河・長江の流域でおこり、殷や甲骨文字で知られる文明は？",a:"中国文明",note:"青銅器の製作も進んだ。"},
      {group:"中国文明",q:"中国文明で、占いの結果を亀の甲や骨に刻んだ、漢字のもとになった文字は？",a:"甲骨文字",note:"殷でさかんに使われた。"},
      {group:"中国文明",q:"紀元前16世紀ごろ中国でおこり、甲骨文字を用いた王朝は？",a:"殷",note:"青銅器の祭器で有名。のちに周がほろぼした。"},
      {group:"中国文明",q:"紀元前3世紀に初めて中国を統一した王朝は？",a:"秦",note:"始皇帝が統一。万里の長城を整備した。"},
      {group:"中国文明",q:"秦を統一に導き、万里の長城を築いた王は？",a:"始皇帝",note:"北方の遊牧民の侵入を防ごうとした。"},
      {group:"中国文明",q:"始皇帝が北方民族の侵入を防ぐために築いた長大な防壁は？",a:"万里の長城",note:"現在も残る世界的な遺構。"},
      {group:"中国文明",q:"秦のあとに中国を治め、シルクロードで西方と交流した王朝は？",a:"漢",note:"絹などが西方へ運ばれた。"},
      {group:"中国文明",q:"漢の時代に東西を結び、絹などが運ばれた交易路は？",a:"シルクロード（絹の道）",note:"のちに仏教が中国へ伝わる道にもなった。"},
      {group:"ギリシャ・ローマ",q:"古代ギリシャで各地につくられた、アテネやスパルタのような都市国家を何という？",a:"ポリス",note:"アテネでは市民が政治に参加する仕組みが発達。"},
      {group:"ギリシャ・ローマ",q:"アテネのアクロポリスの丘に建てられた、ギリシャを代表する神殿は？",a:"パルテノン神殿",note:"ギリシャ建築の代表例。"},
      {group:"ギリシャ・ローマ",q:"地中海一帯を支配し、はじめ共和政、のちに皇帝が治めた古代の大帝国は？",a:"ローマ帝国",note:"水道・道路・法律などをのちの世に残した。"},
      {group:"宗教",q:"仏教・キリスト教・イスラム教の3つをまとめて何という？",a:"三大宗教",note:"民族をこえて広く信仰される宗教。"},
      {group:"宗教",q:"紀元前5世紀ごろ、インドでシャカ（釈迦）が開いた宗教は？",a:"仏教",note:"のちに中国・朝鮮を経て日本へ伝わった。"},
      {group:"宗教",q:"仏教を開いた人物は？",a:"シャカ（釈迦）",note:"苦しみから救われる道を説いた。"},
      {group:"宗教",q:"1世紀ごろ、パレスチナでイエスの教えをもとに生まれた宗教は？",a:"キリスト教",note:"教えは聖書にまとめられ、ヨーロッパへ広がった。"},
      {group:"宗教",q:"キリスト教のもとになる教えを説いた人物は？",a:"イエス",note:"その教えは弟子たちが広めた。"},
      {group:"宗教",q:"7世紀、アラビア半島でムハンマドが開いた宗教は？",a:"イスラム教",note:"聖典はコーラン。西アジア〜北アフリカへ広がった。"},
      {group:"宗教",q:"イスラム教を開いた人物は？",a:"ムハンマド",note:"唯一神アラーの教えを説いた。"},
      {group:"宗教",q:"紀元前6世紀ごろ、中国で孔子が説いた、思いやりや礼を重んじる教えは？",a:"儒学（儒教）",note:"教えは『論語』にまとめられ、日本にも影響した。"},
      {group:"宗教",q:"儒学（儒教）のもとを説いた中国の思想家は？",a:"孔子",note:"弟子が教えを『論語』にまとめた。"},
      {group:"人類と年代",q:"アフリカに現れ、約20万年前に登場した、現在の人類の直接の祖先とされる人類は？",a:"新人（ホモ・サピエンス）",note:"やがて世界中へ広がった。"},
      {group:"人類と年代",q:"石を打ち欠いてつくった、旧石器時代に使われた道具は？",a:"打製石器",note:"みがいてつくる磨製石器と区別する。"},
      {group:"人類と年代",q:"表面をみがいてつくった、新石器時代の石器は？",a:"磨製石器",note:"農耕の始まりとともに広まった。"},
      {group:"人類と年代",q:"100年をひとまとまりとして年代を表す単位を何という？",a:"世紀",note:"例：2001〜2100年が21世紀。"}
    ]
  },
  {
    era:"縄文・弥生時代",
    cards:[
      {group:"縄文土器",q:"縄目のような文様がつけられた、縄文時代を代表する土器は？",a:"縄文土器",note:"低い温度で焼かれ、厚くてもろい。時代名の由来にもなった。"},
      {group:"縄文土器",q:"縄文土器の特徴として、厚さやかたさはどうだった？",a:"厚くてもろい（低温で焼いた）",note:"弥生土器の「薄くてかたい」と対比して覚える。"},
      {group:"くらし",q:"縄文時代の人々が住んだ、地面を掘り下げて柱を立て屋根をかけた住居は？",a:"竪穴住居",note:"むらをつくって定住するようになった。"},
      {group:"くらし",q:"縄文時代の人々が食べ物を得ていた主な方法は？",a:"狩り・漁・採集",note:"まだ稲作は本格的でなく、自然の恵みにたよった。"},
      {group:"くらし",q:"縄文時代、貝がらや食べ物の残りなどを捨てた場所が積もってできた遺跡を何という？",a:"貝塚",note:"当時の食生活を知る手がかりになる。"},
      {group:"信仰",q:"縄文時代につくられた、まじないや豊かな実りへの祈りに使われたとされる土製の人形は？",a:"土偶",note:"女性をかたどったものが多い。"},
      {group:"遺跡（縄文）",q:"青森県にある、縄文時代の大規模な集落あとで知られる遺跡は？",a:"三内丸山遺跡",note:"大型の建物あとなどが見つかり、定住のようすがわかる。"},
      {group:"稲作",q:"弥生時代に大陸から伝わり、人々の生活を大きく変えた農業は？",a:"稲作（米づくり）",note:"食料をたくわえられるようになり、むらやくにが生まれた。"},
      {group:"稲作",q:"弥生時代、稲の穂をつみとるのに使われた道具は？",a:"石包丁",note:"石でつくられた収穫の道具。"},
      {group:"稲作",q:"弥生時代、収穫した米をたくわえるためにつくられた、湿気やねずみを防ぐ倉庫は？",a:"高床倉庫",note:"床を高くして湿気やねずみを防いだ。"},
      {group:"弥生土器",q:"うすくてかたく、赤褐色でかんたんな文様の、弥生時代を代表する土器は？",a:"弥生土器",note:"縄文土器より高い温度で焼かれ、うすくてかたい。"},
      {group:"弥生土器",q:"弥生土器の特徴を、色・厚さの点でいうと？",a:"赤褐色で、うすくてかたい",note:"縄文土器の「厚くてもろい」と対比。"},
      {group:"金属器",q:"弥生時代に大陸から伝わった、青銅器と鉄器をまとめて何という？",a:"金属器",note:"青銅器は主に祭りの道具、鉄器は主に工具・武器に使われた。"},
      {group:"金属器",q:"弥生時代、主に祭りの道具として使われた金属器は？",a:"青銅器",note:"銅鐸（どうたく）などが代表。"},
      {group:"遺跡（弥生）",q:"静岡県にある、水田のあとが見つかった弥生時代の遺跡は？",a:"登呂遺跡",note:"稲作のようすを伝える。"},
      {group:"遺跡（弥生）",q:"佐賀県にある、周りを堀やさくで囲んだ、弥生時代の大規模な環濠集落の遺跡は？",a:"吉野ヶ里遺跡",note:"むら同士の争いがあったことをうかがわせる。"},
      {group:"中国の歴史書",q:"紀元前1世紀ごろの日本について、倭人が100余りの小国（百余国）に分かれていたと記した、中国の歴史書は？",a:"漢書地理志",note:"前漢の歴史書。日本を伝える最も古い記録とされる。"},
      {group:"中国の歴史書",q:"漢書地理志によれば、紀元前1世紀ごろの倭（日本）はどのような状態だったと記されている？",a:"100余りの小国（百余国）に分かれていた",note:"まだ統一されず、小国が分立していた。"},
      {group:"中国の歴史書",q:"漢書地理志で、倭の小国が使いを送っていたとされる、漢が朝鮮半島に置いた拠点は？",a:"楽浪郡",note:"現在の平壌（ピョンヤン）あたりにあった漢の領土。"},

      {group:"幕府の成立",q:"1614〜1615年の二度の戦いで、豊臣氏がほろぼされたできごとは？",a:"大阪の陣（大坂の陣）",note:"これにより徳川の支配が固まった。"},
      {group:"大名の統制",q:"幕府（将軍）と藩（大名）が全国の土地と人民を支配した、江戸時代の政治のしくみを何という？",a:"幕藩体制",note:"幕府と藩による支配体制。"},
      {group:"大名の統制",q:"徳川家の一族の大名を何という？",a:"親藩",note:"尾張・紀伊・水戸の御三家が代表。譜代・外様と区別する。"},
      {group:"大名の統制",q:"古くから徳川家に仕え、要地に配置された大名を何という？",a:"譜代大名",note:"幕府の重要な役職についた。"},
      {group:"大名の統制",q:"関ヶ原の戦いのころから徳川家に従い、江戸から遠くに配置された大名を何という？",a:"外様大名",note:"警戒され、遠方に置かれた。"},
      {group:"大名の統制",q:"江戸幕府が大名を統制するために定めたきまりを何という？",a:"武家諸法度",note:"許可なく城を修理したり、大名どうしが勝手に結婚したりすることを禁じた。"},
      {group:"大名の統制",q:"大名に、1年おきに江戸と領地を往復させ、妻子を江戸に住まわせた制度は？",a:"参勤交代",note:"3代将軍徳川家光が武家諸法度に加えて制度化した。"},
      {group:"大名の統制",q:"参勤交代を制度として定め、幕藩体制を完成させた江戸幕府3代将軍は？",a:"徳川家光",note:"鎖国も完成させた将軍。"},
      {group:"大名の統制",q:"参勤交代は、大名にどのような影響をあたえた？",a:"往復の費用や江戸での生活費が負担となり、藩の財政が苦しくなった",note:"大名の力をおさえるはたらきがあった。"},
      {group:"身分制度",q:"江戸時代、武士・百姓・町人（職人・商人）に人々を区別した身分のしくみをまとめて何という？",a:"士農工商",note:"武士が支配身分で、百姓が人口の大半をしめた。"},
      {group:"身分制度",q:"江戸時代、年貢の納入や犯罪防止のため、百姓に連帯責任を負わせたしくみは？",a:"五人組",note:"5戸ほどを1組にして、たがいに監視・協力させた。"},
      {group:"鎖国への道",q:"江戸時代の初め、幕府の許可状を得た船が東南アジアと行った貿易を何という？",a:"朱印船貿易",note:"東南アジア各地に日本町ができた。"},
      {group:"鎖国への道",q:"1637年、キリスト教徒への迫害や重い年貢に対して、天草四郎を中心に起こった一揆は？",a:"島原・天草一揆",note:"これを機に幕府は鎖国とキリスト教禁止を強めた。"},
      {group:"鎖国への道",q:"キリスト教を防ぐため、幕府が外国との交流を制限した政策を何という？",a:"鎖国",note:"徳川家光のときに完成した。"},
      {group:"鎖国への道",q:"鎖国の下で、キリスト教を布教しないヨーロッパの国として、長崎で貿易を許された国は？",a:"オランダ",note:"長崎の出島で貿易が行われた。"},
      {group:"鎖国への道",q:"鎖国の下で、オランダと中国との貿易のために長崎につくられた人工の島は？",a:"出島",note:"ここに商館が置かれ、外国との窓口となった。"},
      {group:"鎖国への道",q:"キリスト教徒を見つけ出すため、キリストや聖母マリアの像を踏ませたことを何という？",a:"絵踏（踏絵）",note:"信者を発見するために行われた。"}
    ]
  }
];

let state = { eraIndex:0, mode:"random", queue:[], pos:0, correct:0, flipped:false, missedByEra:{} };
const $ = s => document.querySelector(s);
const DRAW = 10;

// 今選んでいる時代の「間違えた問題」配列を取り出す（なければ作る）
function curMissed(){
  const era = ERAS[state.eraIndex].era;
  if(!state.missedByEra[era]) state.missedByEra[era] = [];
  return state.missedByEra[era];
}

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderEras(){
  const box=$("#eras"); box.innerHTML="";
  ERAS.forEach((e,i)=>{
    const b=document.createElement("button");
    b.className="era-btn"+(state.eraIndex===i && state.mode!=="mix"?" active":"");
    b.innerHTML=`${e.era}<span class="cnt">${e.cards.length}</span>`;
    b.onclick=()=>{
      state.eraIndex=i;
      if(state.mode==="mix"){ start("random"); return; }
      if(state.mode==="list"){ showList(); }
      else { start(state.mode==="review"?"random":state.mode); }
    };
    box.appendChild(b);
  });
  // 全時代MIX（見出しの一番最後に配置）
  const total = ERAS.reduce((s,e)=>s+e.cards.length,0);
  const mix=document.createElement("button");
  mix.className="era-btn mix-btn"+(state.mode==="mix"?" active":"");
  mix.innerHTML=`全時代MIX<span class="cnt">${total}</span>`;
  mix.onclick=()=>startMix();
  box.appendChild(mix);
}

function renderModes(){
  const box=$("#modes"); box.innerHTML="";
  const cur=ERAS[state.eraIndex];
  const defs=[
    {key:"random",label:`ランダム${DRAW}問`},
    {key:"all",label:`全問（${cur.cards.length}問）`},
    {key:"list",label:"一覧で見る"}
  ];
  defs.forEach(d=>{
    const b=document.createElement("button");
    b.className="mode-btn"+(state.mode===d.key?" active":"");
    b.textContent=d.label;
    b.onclick=()=> d.key==="list" ? showList() : start(d.key);
    box.appendChild(b);
  });
  const n=curMissed().length;
  const r=document.createElement("button");
  r.className="mode-btn review-btn"+(n?" has":"")+(state.mode==="review"?" active":"");
  r.innerHTML=`間違えた問題<span class="cnt">${n}</span>`;
  r.onclick=()=>{if(n)startReview();};
  box.appendChild(r);
}

function start(mode){
  state.mode=mode;
  const cur=ERAS[state.eraIndex];
  let cards=shuffle(cur.cards);
  if(mode==="random") cards=cards.slice(0,Math.min(DRAW,cur.cards.length));
  state.queue=cards.map(c=>({...c, era:cur.era}));
  begin((mode==="random"?`ランダム${state.queue.length}問`:"全問")+`｜${cur.era}`);
}

/* 全時代MIX：画面内の入力欄で出題数を決める（promptは環境により使えないため） */
function startMix(){
  state.mode="mix";
  const max = ERAS.reduce((s,e)=>s+e.cards.length,0);
  $("#modeLabel").textContent="全時代MIX";
  $("#progress").textContent=`全${max}問`;
  $("#barFill").style.width="0%";
  renderEras(); renderModes();
  $("#main").innerHTML=`
    <div class="mix-setup">
      <h2>全時代MIX</h2>
      <p>全ての時代（合計 ${max}問）から、指定した数だけランダムに出題します。</p>
      <div class="mix-row">
        <label for="mixNum">出題数</label>
        <input id="mixNum" type="number" min="1" max="${max}" value="20" inputmode="numeric">
        <span class="mix-max">/ ${max}</span>
      </div>
      <div class="mix-quick" id="mixQuick"></div>
      <button class="mix-start" id="mixStart">この問題数で始める</button>
    </div>`;
  // クイック選択ボタン（よく使う数をワンタップで）
  const quick = [10,20,30,50].filter(v=>v<=max).concat([max]);
  const uniq = [...new Set(quick)];
  const qbox = $("#mixQuick");
  uniq.forEach(v=>{
    const b=document.createElement("button");
    b.className="mix-chip";
    b.textContent = v===max ? `全${v}` : `${v}`;
    b.onclick=()=>{ $("#mixNum").value = v; };
    qbox.appendChild(b);
  });
  $("#mixStart").onclick=()=>runMix();
  // Enterキーでも開始できるように
  $("#mixNum").addEventListener("keydown", e=>{ if(e.key==="Enter") runMix(); });
}

function runMix(){
  const all = [];
  ERAS.forEach(e=> e.cards.forEach(c=> all.push({...c, era:e.era})));
  const max = all.length;
  let num = parseInt($("#mixNum").value, 10);
  if(isNaN(num) || num<1) num = 1;
  if(num>max) num = max;
  state.mode="mix";
  state.queue = shuffle(all).slice(0, num);
  begin(`全時代MIX ${num}問`);
}

function startReview(){
  state.mode="review";
  const cur=ERAS[state.eraIndex];
  state.queue=shuffle(curMissed().map(m=>({...m})));
  begin(`間違えた問題の解き直し｜${cur.era}`);
}

/* 一覧表示：その時代の全カードを、グループごとに問題文＋答えで並べる */
function showList(){
  state.mode="list";
  const cur=ERAS[state.eraIndex];
  $("#modeLabel").textContent="一覧｜"+cur.era;
  $("#progress").textContent=`${cur.cards.length}問`;
  $("#barFill").style.width="100%";
  renderEras(); renderModes();

  // グループごとにまとめる（データの並び順を保つ）
  const groups=[];
  const map={};
  cur.cards.forEach(c=>{
    const g=c.group||"その他";
    if(!map[g]){ map[g]={name:g,items:[]}; groups.push(map[g]); }
    map[g].items.push(c);
  });

  let html='<div class="list-wrap">';
  groups.forEach(g=>{
    html+=`<div class="list-group"><div class="list-group-head">${g.name}</div>`;
    g.items.forEach(c=>{
      html+=`<div class="list-item"><div class="list-q">${c.q}</div><div class="list-a">${c.a}</div></div>`;
    });
    html+='</div>';
  });
  html+=`<div class="list-count">全 ${cur.cards.length} 問</div></div>`;
  $("#main").innerHTML=html;
}

function begin(label){
  state.pos=0;state.correct=0;state.flipped=false;
  $("#modeLabel").textContent=label;
  renderEras(); renderModes(); renderCard();
}

function renderCard(){
  const total=state.queue.length;
  const c=state.queue[state.pos];
  $("#progress").textContent=`${state.pos+1} / ${total}`;
  $("#barFill").style.width=((state.pos)/total*100)+"%";
  $("#main").innerHTML=`
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow">${c.era||""}${c.group?" · "+c.group:""}</div>
          <div class="body"><div class="q-text">${c.q}</div></div>
          <div class="hint-flip">タップで答えを見る</div>
        </div>
        <div class="face back">
          <div class="eyebrow">こたえ</div>
          <div class="body"><div class="a-text">${c.a}</div></div>
          ${c.note?`<div class="note">${c.note}</div>`:""}
        </div>
      </div>
    </div>
    <div class="judge">
      <button class="miss" id="btnMiss" disabled>まだ覚えてない</button>
      <button class="ok" id="btnOk" disabled>覚えた</button>
    </div>`;
  state.flipped=false;
  const card=$("#card");
  card.onclick=()=>{
    state.flipped=!state.flipped;
    card.classList.toggle("flip",state.flipped);
    $("#btnMiss").disabled=!state.flipped;
    $("#btnOk").disabled=!state.flipped;
  };
  $("#btnMiss").onclick=()=>judge(false,c);
  $("#btnOk").onclick=()=>judge(true,c);
}

function judge(ok,card){
  // このカードが属する時代の「間違い箱」を取得
  const era = card.era || ERAS[state.eraIndex].era;
  if(!state.missedByEra[era]) state.missedByEra[era] = [];
  const box = state.missedByEra[era];
  if(ok){
    state.correct++;
    // 解き直しで正解できたら、その時代の箱から取り除く
    if(state.mode==="review"){
      state.missedByEra[era] = box.filter(m=>!(m.a===card.a && m.q===card.q));
    }
  }else{
    // 間違えた問題を、その時代の箱に記録（同じ問題は重複させない）
    if(!box.some(m=>m.a===card.a && m.q===card.q)){
      box.push({...card});
    }
  }
  // 「間違えた問題」ボタンのカウント表示をその場で更新する
  renderModes();
  state.pos++;
  if(state.pos>=state.queue.length) finish(); else renderCard();
}

function finish(){
  $("#barFill").style.width="100%";
  $("#progress").textContent="完了";
  const total=state.queue.length;
  const pct=Math.round(state.correct/total*100);

  if(state.mode==="mix"){
    // 全時代MIX完了：間違いは各時代に振り分け済み。合計を表示する。
    const totalMiss = ERAS.reduce((s,e)=>{
      const box = state.missedByEra[e.era];
      return s + (box? box.length : 0);
    }, 0);
    $("#main").innerHTML=`
      <div class="done">
        <h2>おつかれさま！</h2>
        <div class="score">${state.correct} / ${total}</div>
        <p>正解率 ${pct}%${totalMiss?` ・ 間違えた問題は各時代にたまっています（合計 ${totalMiss}問）`:" ・ 全問正解！"}</p>
        <div>
          <button onclick="startMix()">もう一度ミックス</button>
          <button class="secondary" onclick="renderModes()">モードを選び直す</button>
        </div>
      </div>`;
    renderEras(); renderModes();
    return;
  }

  const cur=ERAS[state.eraIndex];
  const missNow=curMissed().length;
  $("#main").innerHTML=`
    <div class="done">
      <h2>おつかれさま！</h2>
      <div class="score">${state.correct} / ${total}</div>
      <p>正解率 ${pct}%${missNow?` ・ ${cur.era}の解き直し待ち ${missNow}問`:" ・ この時代はクリア！"}</p>
      <div>
        ${missNow?`<button onclick="startReview()">間違えた問題を解き直す</button>`:""}
        <button onclick="start('random')">もう一度ランダム10問</button>
        <button class="secondary" onclick="renderModes()">モードを選び直す</button>
      </div>
    </div>`;
  renderModes();
}

renderEras();
renderModes();
start("random");
</script>
</body>
</html>
